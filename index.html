<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Rasenschach</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#10281f;
  --panel:#17372b;
  --dark:#0a1712;
  --cream:#f3eedf;
  --muted:#b7c6bd;
  --line:#315747;
  --accent:#d8ff69;
  --danger:#ff816f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #24503f 0,
      #10281f 45%,
      #09140f 100%
    );

  color:var(--cream);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  width:min(
    1100px,
    calc(100% - 24px)
  );

  margin:auto;

  padding:20px 0 60px;
}

header{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:12px;

  margin-bottom:18px;
}

.brand{
  font-size:clamp(25px,5vw,42px);

  font-weight:900;

  letter-spacing:-.04em;
}

.brand span{
  color:var(--accent);
}

.headerActions{
  display:flex;

  align-items:center;
  justify-content:flex-end;

  gap:6px;

  flex-wrap:wrap;

  color:var(--muted);

  font-size:13px;
}

.card{
  background:rgba(23,55,43,.94);

  border:1px solid var(--line);

  border-radius:20px;

  padding:18px;

  margin:12px 0;

  box-shadow:
    0 18px 60px
    rgba(0,0,0,.18);
}

.grid2{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;
}

.grid3{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

@media(max-width:850px){

  .grid3{
    grid-template-columns:
      1fr 1fr;
  }

}

@media(max-width:720px){

  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  header{
    align-items:flex-start;
  }

}

h1,
h2,
h3,
p{
  margin-top:0;
}

h1{
  letter-spacing:-.03em;
}

h2{
  font-size:20px;
}

.muted{
  color:var(--muted);
}

.success{
  color:var(--accent);
}

.error{
  color:var(--danger);
}

input,
select{
  width:100%;

  background:var(--dark);

  color:var(--cream);

  border:1px solid var(--line);

  border-radius:12px;

  padding:12px;

  outline:none;
}

input:focus,
select:focus{
  border-color:var(--accent);
}

button{
  border:0;

  border-radius:12px;

  padding:11px 14px;

  background:var(--cream);

  color:#102018;

  font-weight:800;
}

button.primary{
  background:var(--accent);
}

button.ghost{
  background:transparent;

  color:var(--cream);

  border:1px solid var(--line);
}

button.danger{
  background:transparent;

  color:var(--danger);

  border:
    1px solid
    rgba(255,129,111,.35);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.row{
  display:flex;

  gap:8px;

  align-items:center;

  flex-wrap:wrap;
}

.stack{
  display:grid;

  gap:10px;
}

.thesis{
  background:#0d2119;

  border:1px solid var(--line);

  border-radius:14px;

  padding:13px;
}

.badge{
  display:inline-flex;

  align-items:center;

  gap:6px;

  padding:5px 9px;

  border-radius:100px;

  background:#0c2119;

  border:1px solid var(--line);

  color:var(--muted);

  font-size:12px;

  margin:2px;
}

.fieldButtons{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:10px;
}

.fieldButton{
  min-width:52px;

  background:transparent;

  color:var(--cream);

  border:1px solid var(--line);
}

.fieldButton:hover{
  border-color:var(--accent);
  color:var(--accent);
}

.fieldButton.strong{
  background:var(--accent);

  color:#102018;
}

.turn{
  background:var(--accent);

  color:#102018;

  border-radius:14px;

  padding:13px;

  font-weight:900;

  text-align:center;

  margin-bottom:12px;
}

.phasebar{
  display:flex;

  gap:6px;

  overflow-x:auto;

  margin-bottom:14px;

  scrollbar-width:none;
}

.phasebar::-webkit-scrollbar{
  display:none;
}

.phasebar span{
  white-space:nowrap;

  padding:7px 10px;

  border-radius:99px;

  background:#0b1d16;

  color:#7d9488;

  font-size:12px;
}

.phasebar span.active{
  background:var(--accent);

  color:#102018;

  font-weight:800;
}

.fields{
  display:grid;

  gap:8px;
}

.field{
  display:grid;

  grid-template-columns:
    70px 1fr;

  gap:10px;

  align-items:center;

  background:#0c2119;

  border:1px solid var(--line);

  border-radius:14px;

  padding:10px;
}

.fieldLabel{
  font-size:22px;

  font-weight:900;

  text-align:center;
}

.drawCard{
  text-align:center;

  padding:22px;
}

.drawIcon{
  font-size:42px;

  margin-bottom:8px;
}

.drawWinner{
  font-size:clamp(25px,6vw,42px);

  font-weight:900;

  color:var(--accent);

  margin:6px 0;
}

.lobbyCard{
  display:flex;

  flex-direction:column;

  min-height:210px;
}

.lobbyCode{
  font-size:25px;

  font-weight:900;

  letter-spacing:.08em;

  margin-top:14px;
}

.lobbyActions{
  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-top:auto;

  padding-top:16px;
}

.score{
  display:grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items:center;

  gap:14px;

  text-align:center;
}

.score .points{
  font-size:clamp(34px,8vw,64px);

  font-weight:900;
}

.vs{
  color:var(--muted);

  font-size:24px;

  font-weight:900;
}

.bigResult{
  text-align:center;

  font-size:clamp(32px,8vw,70px);

  font-weight:900;
}

hr{
  border:0;

  border-top:1px solid var(--line);

  margin:18px 0;
}

.footer{
  margin-top:40px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

.loading{
  padding:60px 20px;

  text-align:center;

  color:var(--muted);
}

#toast{
  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  max-width:calc(100% - 30px);

  background:var(--cream);

  color:#102018;

  padding:10px 16px;

  border-radius:100px;

  font-weight:800;

  text-align:center;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:1000;
}

#toast.show{
  opacity:1;
}

</style>

</head>

  </div>

  <div
    id="headerActions"

  ></div>

</header>


<main id="app">

  </div>

</main>


<div class="footer">
  Rasenschach · Fan-Projekt
</div>


</div>


<div id="toast"></div>


<script>


/* =========================================================
   SUPABASE
========================================================= */


const SUPABASE_URL =
  "https://myqerixfnmjgvgwculiw.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_dr_f5ic0-aiiY3wSkX_Rng_1Ye3Vy73";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );



/* =========================================================
   STATE
========================================================= */


let state = {

  user:null,

  gameId:null,

  game:null,

  players:[],

  theses:[],

  placements:[],

  figures:[],

  me:null,

  myGames:[],

  myGamePlayers:[],

  channel:null

};



/* =========================================================
   SPIELREGELN
========================================================= */


const fieldNames = {

  P1:"+1",

  N1:"−1",

  P3:"±3",

  N3:"∓3",

  Q:"?"

};


const figureSequence =
  [
    1,2,2,1,1,
    2,2,1,1,2
  ];


const figureNames = {

  KING:"♔ König",

  QUEEN:"♕ Dame",

  ROOK:"♖ Turm",

  BISHOP:"♗ Läufer",

  KNIGHT:"♘ Springer"

};


const phases = [

  ["lobby","Vorbereitung"],

  ["thesis_draft","Thesendraft"],

  ["figure_draft","Figurendraft"],

  ["scoring","Auswertung"],

  ["finished","Ergebnis"]

];


const statusNames = {

  lobby:"Vorbereitung",

  thesis_draft:"Thesendraft",

  figure_draft:"Figurendraft",

  scoring:"Auswertung",

  finished:"Beendet"

};



/* =========================================================
   HELPERS
========================================================= */


function esc(value){

  return String(
    value ?? ""
  )

  .replaceAll("&","&amp;")

  .replaceAll("<","&lt;")

  .replaceAll(">","&gt;")

  .replaceAll('"',"&quot;");

}



function toast(message){

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    message;


  element.classList.add(
    "show"
  );


  setTimeout(
    () =>
      element.classList.remove(
        "show"
      ),
    2300
  );

}



function errorMessage(error){

  console.error(error);

  toast(
    error?.message ||
    "Etwas ist schiefgelaufen"
  );

}



function appBase(){

  return (
    location.origin +
    location.pathname
  );

}



function gameUrl(id){

  return (
    appBase() +
    "?game=" +
    encodeURIComponent(id)
  );

}



function inviteUrl(code){

  return (
    appBase() +
    "?room=" +
    encodeURIComponent(code)
  );

}



function openGame(id){

  location.href =
    gameUrl(id);

}



function goHome(){

  location.href =
    appBase();

}



function isMainAccount(){

  return Boolean(
    state.user?.email
  );

}



function accountName(){

  return (

    state.user
      ?.user_metadata
      ?.display_name

    ||

    state.user
      ?.email
      ?.split("@")[0]

    ||

    ""

  );

}



function draftedTheses(){

  return state.theses.filter(
    thesis =>
      thesis.drafted_by
  );

}



function currentThesisSeat(){

  const count =
    draftedTheses().length;


  const starter =
    state.game
      ?.thesis_start_seat
    ||
    1;


  const sequence =

    starter === 1

      ? [
          1,2,2,1,1,
          2,2,1,1,2
        ]

      : [
          2,1,1,2,2,
          1,1,2,2,1
        ];


  return (
    sequence[count]
    ??
    null
  );

}



function currentFigureSeat(){

  return (
    figureSequence[
      state.figures.length
    ]

    ??

    null
  );

}



function phaseBar(){

  return `

    <div class="phasebar">

      ${
        phases.map(
          ([id,label]) => `

            <span
              class="${
                state.game?.status === id
                  ? "active"
                  : ""
              }"
            >
              ${label}
            </span>

          `
        ).join("")
      }

    </div>

  `;

}



async function copyInvite(){

  if(!state.game){
    return;
  }


  await copyInviteCode(
    state.game.code
  );

}



async function copyInviteCode(code){

  try{

    await navigator.clipboard
      .writeText(
        inviteUrl(code)
      );


    toast(
      "Einladungslink kopiert"
    );

  }

  catch{

    toast(
      "Link konnte nicht kopiert werden"
    );

  }

}



/* =========================================================
   AUTH
========================================================= */


async function removeAnonymousSession(){

  if(
    state.user &&
    !state.user.email
  ){

    await db.auth.signOut({
      scope:"local"
    });


    state.user =
      null;

  }

}



async function registerMainPlayer(){

  try{

    const name =
      document
        .getElementById(
          "authName"
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          "authEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById(
          "authPassword"
        )
        .value;


    if(
      !name ||
      !email ||
      !password
    ){

      toast(
        "Name, E-Mail und Passwort eingeben"
      );

      return;

    }


    await removeAnonymousSession();


    const {
      data,
      error
    } =
      await db.auth.signUp({

        email,

        password,

        options:{

          data:{
            display_name:name
          },

          emailRedirectTo:
            appBase()

        }

      });


    if(error){
      throw error;
    }


    if(data.session){

      state.user =
        data.session.user;

      goHome();

    }

    else{

      document.getElementById(
        "authMessage"
      ).innerHTML = `

        <div class="success">

          ✓ Konto erstellt.
          Bitte bestätige deine E-Mail.

        </div>

      `;

    }

  }

  catch(error){

    errorMessage(error);

  }

}



async function loginMainPlayer(){

  try{

    const email =
      document
        .getElementById(
          "authEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById(
          "authPassword"
        )
        .value;


    if(
      !email ||
      !password
    ){

      toast(
        "E-Mail und Passwort eingeben"
      );

      return;

    }


    await removeAnonymousSession();


    const {
      data,
      error
    } =
      await db.auth
        .signInWithPassword({

          email,
          password

        });


    if(error){
      throw error;
    }


    state.user =
      data.user;


    location.reload();

  }

  catch(error){

    errorMessage(error);

  }

}



async function logoutMainPlayer(){

  await db.auth.signOut({
    scope:"local"
  });


  state.user =
    null;


  goHome();

}



async function ensureGuestSession(){

  const {
    data:{
      session
    }
  } =
    await db.auth
      .getSession();


  if(session){

    state.user =
      session.user;

    return;

  }


  const {
    data,
    error
  } =
    await db.auth
      .signInAnonymously();


  if(error){
    throw error;
  }


  state.user =
    data.session.user;

}



/* =========================================================
   BOOT
========================================================= */


async function boot(){

  try{

    const {
      data:{
        session
      }
    } =
      await db.auth
        .getSession();


    state.user =
      session?.user
      ||
      null;


    const params =
      new URLSearchParams(
        location.search
      );


    const gameId =
      params.get(
        "game"
      );


    const roomCode =
      params.get(
        "room"
      )
      ?.trim()
      .toUpperCase();



    if(gameId){

      if(!state.user){

        renderLoginRequired();

        return;

      }


      state.gameId =
        gameId;


      await refreshGame();


      subscribe();


      return;

    }



    if(roomCode){

      renderStartPage(
        roomCode
      );

      return;

    }



    if(isMainAccount()){

      await loadDashboard();

      return;

    }



    renderStartPage("");

  }

  catch(error){

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="card">

        <h2>
          Fehler
        </h2>

        <p class="error">
          ${esc(error.message)}
        </p>

      </div>

    `;

  }

}



/* =========================================================
   STARTSEITE
========================================================= */


function renderAuthCard(){

  return `

    <div class="card">

      <h2>
        Hauptspieler
      </h2>

      <p class="muted">

        Melde dich an,
        um deine Lobbys auf
        allen Geräten zu sehen.

      </p>


      <div class="stack">

        <input
          id="authName"
          placeholder="Dein Anzeigename"
        >

        <input
          id="authEmail"
          type="email"
          placeholder="E-Mail"
        >

        <input
          id="authPassword"
          type="password"
          placeholder="Passwort"
        >

        <button
          class="primary"
          onclick="loginMainPlayer()"
        >
          Einloggen
        </button>

        <button
          class="ghost"
          onclick="registerMainPlayer()"
        >
          Konto erstellen
        </button>

        <div
          id="authMessage"
          class="muted"
        ></div>

      </div>

    </div>

  `;

}



function renderJoinCard(roomCode=""){

  return `

    <div class="card">

      <h2>
        Spieler 2
      </h2>

      <p class="muted">

        Als eingeladener Spieler
        brauchst du kein Konto.

      </p>

      <div class="stack">

        <input
          id="joinName"
          placeholder="Dein Name"
        >

        <input
          id="joinCode"
          maxlength="6"
          placeholder="Raumcode"
          value="${esc(roomCode)}"
        >

        <button
          onclick="joinGame()"
        >
          Lobby beitreten
        </button>

      </div>

    </div>

  `;

}



function renderStartPage(roomCode=""){

  document.getElementById(
    "headerActions"
  ).innerHTML =
    "";


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h1>
        Rasenschach
      </h1>

      <p class="muted">

        Mehrere Zweier-Lobbys.
        Ein Hauptspieler-Konto.
        Unterschiedliche Gegner.

      </p>

    </div>


    <div class="grid2">

      ${
        isMainAccount()

          ? `

            <div class="card">

              <h2>
                Angemeldet
              </h2>

              <strong>
                ${esc(accountName())}
              </strong>

              <p class="muted">
                ${esc(state.user.email)}
              </p>

              <button
                class="primary"
                onclick="goHome()"
              >
                Meine Lobbys
              </button>

            </div>

          `

          : renderAuthCard()
      }


      ${renderJoinCard(roomCode)}

    </div>

  `;

}



function renderLoginRequired(){

  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h2>
        Anmeldung erforderlich
      </h2>

    </div>

    ${renderAuthCard()}

  `;

}



/* =========================================================
   DASHBOARD
========================================================= */


async function loadDashboard(){

  const membershipResult =
    await db
      .from("players")
      .select(
        "game_id,seat,user_id"
      )
      .eq(
        "user_id",
        state.user.id
      );


  if(membershipResult.error){
    throw membershipResult.error;
  }


  const memberships =
    membershipResult.data
    ||
    [];


  if(!memberships.length){

    state.myGames =
      [];

    state.myGamePlayers =
      [];

    renderDashboard();

    return;

  }


  const gameIds = [
    ...new Set(
      memberships.map(
        membership =>
          membership.game_id
      )
    )
  ];


  const [
    gameResult,
    playerResult
  ] =
    await Promise.all([

      db
        .from("games")
        .select("*")
        .in("id",gameIds)
        .order(
          "created_at",
          {
            ascending:false
          }
        ),

      db
        .from("players")
        .select("*")
        .in("game_id",gameIds)
        .order("seat")

    ]);


  if(gameResult.error){
    throw gameResult.error;
  }


  if(playerResult.error){
    throw playerResult.error;
  }


  state.myGames =
    gameResult.data
    ||
    [];


  state.myGamePlayers =
    playerResult.data
    ||
    [];


  renderDashboard();

}



function renderDashboard(){

  document.getElementById(
    "headerActions"
  ).innerHTML = `

    <span>
      ${esc(state.user.email)}
    </span>

    <button
      class="ghost"
      onclick="logoutMainPlayer()"
    >
      Abmelden
    </button>

  `;


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h1>
        Hallo ${esc(accountName())}
      </h1>

      <p class="muted">

        Alle deine Lobbys
        werden hier gesammelt.

      </p>

    </div>


    <div class="card">

      <h2>
        Neue Lobby
      </h2>

      <div class="row">

        <input
          id="createName"
          value="${esc(accountName())}"
          style="flex:1;min-width:220px"
        >

        <button
          class="primary"
          onclick="createGame()"
        >
          Lobby erstellen
        </button>

      </div>

    </div>


    <div class="card">

      <h2>
        Meine Lobbys ·
        ${state.myGames.length}
      </h2>

      ${
        state.myGames.length

          ? `

            <div class="grid3">

              ${
                state.myGames.map(
                  game =>
                    renderLobbyCard(
                      game
                    )
                ).join("")
              }

            </div>

          `

          : `

            <div class="thesis">

              <span class="muted">
                Noch keine Lobby.
              </span>

            </div>

          `
      }

    </div>

  `;

}



function renderLobbyCard(game){

  const players =
    state.myGamePlayers.filter(
      player =>
        player.game_id ===
        game.id
    );

/* =========================================================
   GAME DATA
========================================================= */


async function refreshGame(){

  const [
    gameResult,
    playerResult,
    thesisResult,
    placementResult,
    figureResult
  ] =
    await Promise.all([

      db
        .from("games")
        .select("*")
        .eq("id",state.gameId)
        .single(),

      db
        .from("players")
        .select("*")
        .eq(
          "game_id",
          state.gameId
        )
        .order("seat"),

      db
        .from("theses")
        .select("*")
        .eq(
          "game_id",
          state.gameId
        )
        .order("created_at"),

      db
        .from("placements")
        .select("*")
        .eq(
          "game_id",
          state.gameId
        ),

      db
        .from("figure_picks")
        .select("*")
        .eq(
          "game_id",
          state.gameId
        )
        .order("draft_order")

    ]);


  if(gameResult.error){
    throw gameResult.error;
  }


  if(playerResult.error){
    throw playerResult.error;
  }


  if(thesisResult.error){
    throw thesisResult.error;
  }


  if(placementResult.error){
    throw placementResult.error;
  }


  if(figureResult.error){
    throw figureResult.error;
  }


  state.game =
    gameResult.data;


  state.players =
    playerResult.data || [];


  state.theses =
    thesisResult.data || [];


  state.placements =
    placementResult.data || [];


  state.figures =
    figureResult.data || [];


  state.me =
    state.players.find(
      player =>
        player.user_id ===
        state.user.id
    );


  renderGame();

}



/* =========================================================
   REALTIME
========================================================= */


let refreshTimer;


function scheduleRefresh(){

  clearTimeout(
    refreshTimer
  );


  refreshTimer =
    setTimeout(
      () =>
        refreshGame()
          .catch(
            errorMessage
          ),
      150
    );

}



function subscribe(){

  if(state.channel){

    db.removeChannel(
      state.channel
    );

  }


  const channel =
    db.channel(
      `rasenschach-${state.gameId}`
    );


  [
    "games",
    "players",
    "theses",
    "placements",
    "figure_picks"
  ].forEach(
    table => {

      channel.on(

        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table,

          filter:

            table ===
            "games"

              ? `id=eq.${state.gameId}`

              : `game_id=eq.${state.gameId}`
        },

        scheduleRefresh

      );

    }
  );


  channel.subscribe();


  state.channel =
    channel;

}

/* =========================================================
   PUNKTE
========================================================= */


function thesisPoints(
  placement,
  thesis
){

  if(
    thesis?.resolved === null
    ||
    thesis?.resolved === undefined
  ){
    return 0;
  }


  const correct =
    thesis.resolved;


  switch(
    placement.field
  ){

    case "P1":

      return correct
        ? 1
        : 0;


    case "N1":

      return correct
        ? 0
        : 1;


    case "P3":

      return correct
        ? 3
        : -3;


    case "N3":

      return correct
        ? -3
        : 3;


    case "Q":

      return correct

        ? state.game.random_value

        : -state.game.random_value;

  }


  return 0;

}



function playerScore(userId){

  let thesisTotal = 0;
  let figureTotal = 0;


  state.placements

    .filter(
      placement =>
        placement.user_id ===
        userId
    )

    .forEach(
      placement => {

        const thesis =
          state.theses.find(
            item =>
              item.id ===
              placement.thesis_id
          );


        thesisTotal +=
          thesisPoints(
            placement,
            thesis
          );

      }
    );


  state.figures

    .filter(
      figure =>
        figure.user_id ===
        userId
    )

    .forEach(
      figure => {

        figureTotal +=
          Number(
            figure.points || 0
          );

      }
    );


  return {

    thesis:thesisTotal,

    figures:figureTotal,

    total:
      thesisTotal +
      figureTotal

  };

}

                      return `

                        <div class="thesis">

                          <strong>

                            ${
                              fieldNames[
                                placement.field
                              ]
                            }

                            ·

                            ${
                              points >= 0
                                ? "+"
                                : ""
                            }

                            ${points}

                          </strong>


                          <p>

                            ${esc(
                              thesis.text
                            )}

                          </p>


                          ${
                            finished

                              ? `

                                <span class="muted">

                                  ${
                                    thesis.resolved

                                      ? "✓ eingetreten"

                                      : "✕ nicht eingetreten"
                                  }

                                </span>

                              `

                              : `

                                <div class="row">

                                  <button
                                    onclick="
                                      resolveThesis(
                                        '${thesis.id}',
                                        true
                                      )
                                    "
                                  >
                                    Eingetreten
                                  </button>

                                  <button
                                    class="ghost"

                                    onclick="
                                      resolveThesis(
                                        '${thesis.id}',
                                        false
                                      )
                                    "
                                  >
                                    Nicht eingetreten
                                  </button>

                                </div>

                              `
                          }

                        </div>

                      `;

                    }
                  ).join("")
                }


                <hr>


                <h3>
                  Figuren
                </h3>


                ${
                  figures.map(
                    figure => `

                      <div class="thesis">

                        <strong>

                          ${
                            figureNames[
                              figure.figure
                            ]
                          }

                          ·

                          ${esc(
                            figure.footballer
                          )}

                        </strong>


                        ${
                          finished

                            ? `

                              <div>

                                ${
                                  figure.points >= 0
                                    ? "+"
                                    : ""
                                }

                                ${figure.points}
                                Punkte

                              </div>

                            `

                            : `

                              <div
                                class="row"
                                style="
                                  margin-top:10px
                                "
                              >

                                <button
                                  class="ghost"

                                  onclick="
                                    setFigurePoints(
                                      '${figure.id}',
                                      ${
                                        Number(
                                          figure.points
                                        ) - 1
                                      }
                                    )
                                  "
                                >
                                  −
                                </button>

                                <strong>
                                  ${figure.points}
                                </strong>

                                <button
                                  class="ghost"

                                  onclick="
                                    setFigurePoints(
                                      '${figure.id}',
                                      ${
                                        Number(
                                          figure.points
                                        ) + 1
                                      }
                                    )
                                  "
                                >
                                  +
                                </button>

                              </div>

                            `
                        }

                      </div>

                    `
                  ).join("")
                }

              </div>

            `;

          }
        ).join("")
      }

    </div>


    ${
      !finished

        ? `

          <div class="card">

            <button
              class="primary"
              onclick="finishGame()"
            >
              Abpfiff
            </button>

          </div>

        `

        : ""
    }

  `;

}



async function resolveThesis(
  id,
  value
){

  const {
    error
  } =
    await db.rpc(
      "resolve_thesis",
      {

        p_thesis_id:id,

        p_resolved:value

      }
    );


  if(error){
    errorMessage(error);
  }

}



async function setFigurePoints(
  id,
  points
){

  const {
    error
  } =
    await db.rpc(
      "set_figure_points",
      {

        p_pick_id:id,

        p_points:points

      }
    );


  if(error){
    errorMessage(error);
  }

}



async function finishGame(){

  const {
    error
  } =
    await db.rpc(
      "finish_game",
      {
        p_game_id:
          state.gameId
      }
    );


  if(error){
    errorMessage(error);
  }

}



/* =========================================================
   START
========================================================= */


boot();


</script>

</body>

</html>
