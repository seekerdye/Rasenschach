<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Rasenschach</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#10281f;
  --panel:#17372b;
  --dark:#0a1712;
  --cream:#f3eedf;
  --muted:#b7c6bd;
  --line:#315747;
  --accent:#d8ff69;
  --danger:#ff816f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #24503f 0,
      #10281f 45%,
      #09140f 100%
    );

  color:var(--cream);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  width:min(
    1100px,
    calc(100% - 24px)
  );

  margin:auto;

  padding:
    20px 0 60px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:12px;

  margin-bottom:18px;
}

.brand{
  font-size:
    clamp(
      25px,
      5vw,
      42px
    );

  font-weight:900;

  letter-spacing:-.04em;
}

.brand span{
  color:var(--accent);
}

.headerActions{
  display:flex;

  align-items:center;
  justify-content:flex-end;

  flex-wrap:wrap;

  gap:6px;

  color:var(--muted);

  font-size:13px;
}

.card{
  background:
    rgba(
      23,
      55,
      43,
      .94
    );

  border:
    1px solid
    var(--line);

  border-radius:20px;

  padding:18px;

  margin:12px 0;

  box-shadow:
    0 18px 60px
    rgba(0,0,0,.18);
}

.grid2{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;
}

.grid3{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

@media(max-width:850px){

  .grid3{
    grid-template-columns:
      1fr 1fr;
  }

}

@media(max-width:720px){

  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  header{
    align-items:flex-start;
  }

}

h1,
h2,
h3,
p{
  margin-top:0;
}

h1{
  letter-spacing:-.03em;
}

h2{
  font-size:20px;
}

.muted{
  color:var(--muted);
}

.success{
  color:var(--accent);
}

.error{
  color:var(--danger);
}

input,
select{
  width:100%;

  background:var(--dark);

  color:var(--cream);

  border:
    1px solid
    var(--line);

  border-radius:12px;

  padding:12px;

  outline:none;
}

input:focus,
select:focus{
  border-color:var(--accent);
}

button{
  border:0;

  border-radius:12px;

  padding:
    11px 14px;

  background:var(--cream);

  color:#102018;

  font-weight:800;
}

button.primary{
  background:var(--accent);
}

button.ghost{
  background:transparent;

  color:var(--cream);

  border:
    1px solid
    var(--line);
}

button.danger{
  background:transparent;

  color:var(--danger);

  border:
    1px solid
    rgba(
      255,
      129,
      111,
      .35
    );
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.row{
  display:flex;

  gap:8px;

  align-items:center;

  flex-wrap:wrap;
}

.stack{
  display:grid;

  gap:10px;
}

.thesis{
  background:#0d2119;

  border:
    1px solid
    var(--line);

  border-radius:14px;

  padding:13px;
}

.badge{
  display:inline-flex;

  align-items:center;

  gap:6px;

  padding:
    5px 9px;

  border-radius:100px;

  background:#0c2119;

  border:
    1px solid
    var(--line);

  color:var(--muted);

  font-size:12px;

  margin:2px;
}

.lobbyCard{
  display:flex;

  flex-direction:column;

  min-height:220px;
}

.lobbyCode{
  font-size:26px;

  font-weight:900;

  letter-spacing:.08em;

  margin-top:14px;
}

.lobbyActions{
  margin-top:auto;

  padding-top:16px;

  display:flex;

  gap:8px;

  flex-wrap:wrap;
}

.accountBox{
  display:flex;

  align-items:center;

  gap:8px;

  flex-wrap:wrap;
}

.turn{
  background:var(--accent);

  color:#102018;

  border-radius:14px;

  padding:13px;

  font-weight:900;

  text-align:center;

  margin-bottom:12px;
}

.phasebar{
  display:flex;

  gap:6px;

  overflow-x:auto;

  margin-bottom:14px;

  scrollbar-width:none;
}

.phasebar::-webkit-scrollbar{
  display:none;
}

.phasebar span{
  white-space:nowrap;

  padding:
    7px 10px;

  border-radius:99px;

  background:#0b1d16;

  color:#7d9488;

  font-size:12px;
}

.phasebar span.active{
  background:var(--accent);

  color:#102018;

  font-weight:800;
}

.fields{
  display:grid;

  gap:8px;
}

.field{
  display:grid;

  grid-template-columns:
    70px 1fr;

  gap:10px;

  align-items:center;

  background:#0c2119;

  border:
    1px solid
    var(--line);

  border-radius:14px;

  padding:10px;
}

.fieldLabel{
  font-size:22px;

  font-weight:900;

  text-align:center;
}

.drawCard{
  text-align:center;

  padding:22px;
}

.drawIcon{
  font-size:42px;

  margin-bottom:8px;
}

.drawWinner{
  font-size:
    clamp(
      25px,
      6vw,
      42px
    );

  font-weight:900;

  color:var(--accent);

  margin:6px 0;
}

.score{
  display:grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items:center;

  gap:14px;

  text-align:center;
}

.score .points{
  font-size:
    clamp(
      34px,
      8vw,
      64px
    );

  font-weight:900;
}

.vs{
  color:var(--muted);

  font-size:24px;

  font-weight:900;
}

.bigResult{
  text-align:center;

  font-size:
    clamp(
      32px,
      8vw,
      70px
    );

  font-weight:900;
}

hr{
  border:0;

  border-top:
    1px solid
    var(--line);

  margin:
    18px 0;
}

.footer{
  margin-top:40px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

.loading{
  padding:
    60px 20px;

  text-align:center;

  color:var(--muted);
}

#toast{
  position:fixed;

  left:50%;
  bottom:20px;

  transform:
    translateX(-50%);

  max-width:
    calc(100% - 30px);

  background:var(--cream);

  color:#102018;

  padding:
    10px 16px;

  border-radius:100px;

  font-weight:800;

  text-align:center;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:1000;
}

#toast.show{
  opacity:1;
}

</style>

</head>


<body>

<div class="shell">

<header>

  <div class="brand">
    RASEN<span>SCHACH</span>
  </div>

  <div
    id="headerActions"
    class="headerActions"
  ></div>

</header>


<main id="app">

  <div class="loading">
    Rasenschach wird geladen …
  </div>

</main>


<div class="footer">
  Rasenschach · Fan-Projekt
</div>

</div>


<div id="toast"></div>


<script>


/* =========================================================
   SUPABASE
========================================================= */


const SUPABASE_URL =
  "https://myqerixfnmjgvgwculiw.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_dr_f5ic0-aiiY3wSkX_Rng_1Ye3Vy73";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );



/* =========================================================
   STATE
========================================================= */


let state = {

  user:null,

  gameId:null,

  game:null,

  players:[],

  theses:[],

  placements:[],

  figures:[],

  me:null,

  myGames:[],

  myGamePlayers:[],

  channel:null

};



/* =========================================================
   KONSTANTEN
========================================================= */


const figureSequence =
  [
    1,
    2,
    2,
    1,
    1,
    2,
    2,
    1,
    1,
    2
  ];


const figureNames = {

  KING:"♔ König",

  QUEEN:"♕ Dame",

  ROOK:"♖ Turm",

  BISHOP:"♗ Läufer",

  KNIGHT:"♘ Springer"

};


const fieldNames = {

  P1:"+1",

  N1:"−1",

  P3:"±3",

  N3:"∓3",

  Q:"?"

};


const phases = [

  ["lobby","Vorbereitung"],

  ["thesis_draft","Thesendraft"],

  ["thesis_placement","Setzen"],

  ["figure_draft","Figurendraft"],

  ["scoring","Auswertung"],

  ["finished","Ergebnis"]

];


const statusNames = {

  lobby:"Vorbereitung",

  thesis_draft:"Thesendraft",

  thesis_placement:"Thesen setzen",

  figure_draft:"Figurendraft",

  scoring:"Auswertung",

  finished:"Beendet"

};



/* =========================================================
   HELPERS
========================================================= */


function esc(
  value
){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  );

}



function toast(
  message
){

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    message;


  element.classList.add(
    "show"
  );


  setTimeout(
    () => {

      element
        .classList
        .remove(
          "show"
        );

    },
    2400
  );

}



function errorMessage(
  error
){

  console.error(
    error
  );


  toast(
    error?.message ||
    "Etwas ist schiefgelaufen"
  );

}



function appBase(){

  return (
    location.origin +
    location.pathname
  );

}



function gameUrl(
  id
){

  return (
    appBase() +
    "?game=" +
    encodeURIComponent(
      id
    )
  );

}



function inviteUrl(
  code
){

  return (
    appBase() +
    "?room=" +
    encodeURIComponent(
      code
    )
  );

}



function openGame(
  id
){

  location.href =
    gameUrl(
      id
    );

}



function goHome(){

  location.href =
    appBase();

}



function isMainAccount(){

  return Boolean(
    state.user?.email
  );

}



function accountName(){

  return (
    state.user
      ?.user_metadata
      ?.display_name

    ||

    state.user
      ?.email
      ?.split("@")[0]

    ||

    ""
  );

}



function draftedTheses(){

  return state.theses.filter(
    thesis =>
      thesis.drafted_by
  );

}



function currentThesisSeat(){

  const count =
    draftedTheses()
      .length;


  const starter =
    state.game
      ?.thesis_start_seat
    ||
    1;


  const sequence =

    starter === 1

      ? [
          1,2,2,1,1,
          2,2,1,1,2
        ]

      : [
          2,1,1,2,2,
          1,1,2,2,1
        ];


  return (
    sequence[count]
    ??
    null
  );

}



function currentFigureSeat(){

  return (
    figureSequence[
      state.figures.length
    ]
    ??
    null
  );

}



function phaseBar(){

  return `

    <div class="phasebar">

      ${phases.map(
        ([id,label]) => `

          <span
            class="${
              state.game?.status === id
                ? "active"
                : ""
            }"
          >
            ${label}
          </span>

        `
      ).join("")}

    </div>

  `;

}



async function copyInvite(){

  if(
    !state.game
  ){
    return;
  }


  await copyInviteCode(
    state.game.code
  );

}



async function copyInviteCode(
  code
){

  try{

    await navigator
      .clipboard
      .writeText(
        inviteUrl(
          code
        )
      );


    toast(
      "Einladungslink kopiert"
    );

  }

  catch{

    toast(
      "Link konnte nicht kopiert werden"
    );

  }

}



/* =========================================================
   LOGIN / REGISTRIERUNG
========================================================= */


async function removeAnonymousSession(){

  if(
    state.user &&
    !state.user.email
  ){

    await db.auth.signOut(
      {
        scope:"local"
      }
    );


    state.user =
      null;

  }

}



async function registerMainPlayer(){

  try{

    const name =
      document
        .getElementById(
          "authName"
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          "authEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById(
          "authPassword"
        )
        .value;


    if(
      !name ||
      !email ||
      !password
    ){

      toast(
        "Name, E-Mail und Passwort eingeben"
      );

      return;

    }


    if(
      password.length < 6
    ){

      toast(
        "Passwort muss mindestens 6 Zeichen haben"
      );

      return;

    }


    await removeAnonymousSession();


    const {
      data,
      error
    } =
      await db.auth.signUp(
        {

          email,

          password,

          options:{

            data:{
              display_name:name
            },

            emailRedirectTo:
              appBase()

          }

        }
      );


    if(
      error
    ){

      throw error;

    }


    if(
      data.session
    ){

      state.user =
        data.session.user;


      toast(
        "Konto erstellt"
      );


      goHome();

    }

    else{

      const message =
        document.getElementById(
          "authMessage"
        );


      if(
        message
      ){

        message.innerHTML = `

          <div class="success">

            ✓ Konto angelegt.
            Bitte bestätige jetzt
            die E-Mail, die Supabase
            dir geschickt hat.

          </div>

        `;

      }

    }

  }

  catch(
    error
  ){

    errorMessage(
      error
    );

  }

}



async function loginMainPlayer(){

  try{

    const email =
      document
        .getElementById(
          "authEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById(
          "authPassword"
        )
        .value;


    if(
      !email ||
      !password
    ){

      toast(
        "E-Mail und Passwort eingeben"
      );

      return;

    }


    await removeAnonymousSession();


    const {
      data,
      error
    } =
      await db.auth
        .signInWithPassword(
          {
            email,
            password
          }
        );


    if(
      error
    ){

      throw error;

    }


    state.user =
      data.user;


    toast(
      "Erfolgreich angemeldet"
    );


    location.reload();

  }

  catch(
    error
  ){

    errorMessage(
      error
    );

  }

}



async function logoutMainPlayer(){

  try{

    const {
      error
    } =
      await db.auth.signOut(
        {
          scope:"local"
        }
      );


    if(
      error
    ){

      throw error;

    }


    state.user =
      null;


    goHome();

  }

  catch(
    error
  ){

    errorMessage(
      error
    );

  }

}



/* =========================================================
   ANONYMER GAST
========================================================= */


async function ensureGuestSession(){

  const {
    data:{
      session
    }
  } =
    await db.auth
      .getSession();


  if(
    session
  ){

    state.user =
      session.user;

    return session;

  }


  const {
    data,
    error
  } =
    await db.auth
      .signInAnonymously();


  if(
    error
  ){

    throw error;

  }


  state.user =
    data.session.user;


  return data.session;

}



/* =========================================================
   BOOT
========================================================= */


async function boot(){

  try{

    const {
      data:{
        session
      },
      error
    } =
      await db.auth
        .getSession();


    if(
      error
    ){

      throw error;

    }


    state.user =
      session?.user
      ||
      null;


    const params =
      new URLSearchParams(
        location.search
      );


    const gameId =
      params.get(
        "game"
      );


    const roomCode =
      params.get(
        "room"
      )
      ?.trim()
      .toUpperCase();



    /*
      DIREKTE SPIEL-URL
    */

    if(
      gameId
    ){

      if(
        !state.user
      ){

        renderLoginRequired();

        return;

      }


      state.gameId =
        gameId;


      await refreshGame();


      subscribe();


      return;

    }



    /*
      EINLADUNGSLINK
    */

    if(
      roomCode
    ){

      renderStartPage(
        roomCode
      );

      return;

    }



    /*
      HAUPTSPIELER DASHBOARD
    */

    if(
      isMainAccount()
    ){

      await loadDashboard();

      return;

    }



    /*
      NICHT EINGELOGGT
    */

    renderStartPage(
      ""
    );

  }

  catch(
    error
  ){

    console.error(
      error
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="card">

        <h2>
          Fehler beim Laden
        </h2>

        <p class="error">

          ${esc(
            error.message
          )}

        </p>

        <button
          onclick="goHome()"
        >
          Zur Startseite
        </button>

      </div>

    `;

  }

}



/* =========================================================
   LOGIN FÜR DIREKTE SPIEL-URL
========================================================= */


function renderLoginRequired(){

  document.getElementById(
    "headerActions"
  ).innerHTML =
    "";


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h1>
        Anmeldung erforderlich
      </h1>

      <p class="muted">

        Melde dich mit deinem
        Rasenschach-Konto an,
        um diese Lobby zu öffnen.

      </p>

    </div>


    ${renderAuthCard()}

  `;

}



/* =========================================================
   STARTSEITE
========================================================= */


function renderStartPage(
  roomCode=""
){

  document.getElementById(
    "headerActions"
  ).innerHTML =

    isMainAccount()

      ? `

          <span>
            ${esc(
              state.user.email
            )}
          </span>

          <button
            class="ghost"
            onclick="goHome()"
          >
            Meine Lobbys
          </button>

        `

      : "";


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h1>
        Rasenschach für zwei.
      </h1>

      <p class="muted">

        Erstelle mehrere parallele
        Duelle und spiele gegen
        unterschiedliche Freunde.

      </p>

    </div>


    <div class="grid2">


      ${
        isMainAccount()

          ? `

            <div class="card">

              <h2>
                Hauptspieler
              </h2>

              <p>
                Angemeldet als
                <strong>
                  ${esc(
                    accountName()
                  )}
                </strong>
              </p>

              <p class="muted">
                ${esc(
                  state.user.email
                )}
              </p>

              <button
                class="primary"
                onclick="goHome()"
              >
                Meine Lobbys
              </button>

            </div>

          `

          : renderAuthCard()
      }


      ${renderJoinCard(
        roomCode
      )}


    </div>

  `;

}



function renderAuthCard(){

  return `

    <div class="card">

      <h2>
        Hauptspieler
      </h2>

      <p class="muted">

        Melde dich an, damit deine
        Lobbys auf allen Geräten
        verfügbar sind.

      </p>


      <div class="stack">


        <input
          id="authName"
          maxlength="40"
          placeholder="Dein Anzeigename"
        >


        <input
          id="authEmail"
          type="email"
          autocomplete="email"
          placeholder="E-Mail-Adresse"
        >


        <input
          id="authPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Passwort"
        >


        <button
          class="primary"
          onclick="loginMainPlayer()"
        >
          Einloggen
        </button>


        <button
          class="ghost"
          onclick="registerMainPlayer()"
        >
          Neues Konto erstellen
        </button>


        <div
          id="authMessage"
          class="muted"
        ></div>


      </div>

    </div>

  `;

}



function renderJoinCard(
  roomCode=""
){

  return `

    <div class="card">

      <h2>
        Einladung erhalten?
      </h2>

      <p class="muted">

        Spieler 2 benötigt
        kein Konto.

      </p>


      <div class="stack">


        <input
          id="joinName"
          maxlength="30"
          placeholder="Dein Name"
        >


        <input
          id="joinCode"
          maxlength="6"
          placeholder="Raumcode"
          value="${esc(
            roomCode
          )}"
        >


        <button
          onclick="joinGame()"
        >
          Lobby beitreten
        </button>


      </div>

    </div>

  `;

}



/* =========================================================
   DASHBOARD
========================================================= */


async function loadDashboard(){

  if(
    !isMainAccount()
  ){

    renderStartPage();

    return;

  }


  state.gameId =
    null;


  state.game =
    null;


  if(
    state.channel
  ){

    db.removeChannel(
      state.channel
    );


    state.channel =
      null;

  }



  const membershipResult =
    await db

      .from(
        "players"
      )

      .select(
        "game_id,seat,user_id"
      )

      .eq(
        "user_id",
        state.user.id
      );



  if(
    membershipResult.error
  ){

    throw membershipResult.error;

  }



  const memberships =
    membershipResult.data
    ||
    [];



  if(
    !memberships.length
  ){

    state.myGames =
      [];


    state.myGamePlayers =
      [];


    renderDashboard();


    return;

  }



  const gameIds =

    [
      ...new Set(
        memberships.map(
          membership =>
            membership.game_id
        )
      )
    ];



  const [
    gameResult,
    playerResult
  ] =
    await Promise.all([


      db
        .from(
          "games"
        )

        .select(
          "*"
        )

        .in(
          "id",
          gameIds
        )

        .order(
          "created_at",
          {
            ascending:false
          }
        ),


      db
        .from(
          "players"
        )

        .select(
          "*"
        )

        .in(
          "game_id",
          gameIds
        )

        .order(
          "seat"
        )


    ]);



  if(
    gameResult.error
  ){

    throw gameResult.error;

  }



  if(
    playerResult.error
  ){

    throw playerResult.error;

  }



  state.myGames =
    gameResult.data
    ||
    [];


  state.myGamePlayers =
    playerResult.data
    ||
    [];


  renderDashboard();

}

async function refreshGame(){

  if(
    !state.gameId
  ){

    return;

  }



  const [

    gameResult,

    playerResult,

    thesisResult,

    placementResult,

    figureResult

  ] =
    await Promise.all([


      db
        .from(
          "games"
        )

        .select(
          "*"
        )

        .eq(
          "id",
          state.gameId
        )

        .single(),



      db
        .from(
          "players"
        )

        .select(
          "*"
        )

        .eq(
          "game_id",
          state.gameId
        )

        .order(
          "seat"
        ),



      db
        .from(
          "theses"
        )

        .select(
          "*"
        )

        .eq(
          "game_id",
          state.gameId
        )

        .order(
          "created_at"
        ),



      db
        .from(
          "placements"
        )

        .select(
          "*"
        )

        .eq(
          "game_id",
          state.gameId
        ),



      db
        .from(
          "figure_picks"
        )

        .select(
          "*"
        )

        .eq(
          "game_id",
          state.gameId
        )

        .order(
          "draft_order"
        )


    ]);



  if(
    gameResult.error
  ){

    throw gameResult.error;

  }



  if(
    playerResult.error
  ){

    throw playerResult.error;

  }



  if(
    thesisResult.error
  ){

    throw thesisResult.error;

  }



  if(
    placementResult.error
  ){

    throw placementResult.error;

  }



  if(
    figureResult.error
  ){

    throw figureResult.error;

  }



  state.game =
    gameResult.data;


  state.players =
    playerResult.data
    ||
    [];


  state.theses =
    thesisResult.data
    ||
    [];


  state.placements =
    placementResult.data
    ||
    [];


  state.figures =
    figureResult.data
    ||
    [];


  state.me =
    state.players.find(
      player =>
        player.user_id ===
        state.user.id
    );



  if(
    !state.me
  ){

    throw new Error(
      "Du bist kein Mitglied dieser Lobby."
    );

  }



  renderGame();

}



/* =========================================================
   REALTIME
========================================================= */


let refreshTimer;


function scheduleRefresh(){

  clearTimeout(
    refreshTimer
  );


  refreshTimer =
    setTimeout(
      () => {

        refreshGame()
          .catch(
            errorMessage
          );

      },
      150
    );

}



function subscribe(){

  if(
    state.channel
  ){

    db.removeChannel(
      state.channel
    );

  }



  const channel =
    db.channel(
      `rasenschach-${state.gameId}`
    );



  [

    "games",

    "players",

    "theses",

    "placements",

    "figure_picks"

  ]

  .forEach(
    table => {

      channel.on(

        "postgres_changes",

        {

          event:"*",

          schema:"public",

          table,

          filter:

            table ===
            "games"

              ? `id=eq.${state.gameId}`

              : `game_id=eq.${state.gameId}`

        },

        scheduleRefresh

      );

    }
  );



  channel.subscribe();


  state.channel =
    channel;

}

        placement.user_id ===
        userId

  return `

  ){

    toast(
      "Fußballer eingeben"
    );

  }



  try{

    const {
      error
    } =
      await db.rpc(
        "pick_figure",
        {

          p_game_id:
            state.gameId,

          p_figure:
            figure,

          p_footballer:
            footballer,

          p_club:

            null

        }
      );

    }

  }

/* =========================================================
   PUNKTE
========================================================= */


function thesisPoints(
  placement,
  thesis
){

  if(
    thesis?.resolved === null
    ||
    thesis?.resolved === undefined
  ){

    return 0;

  }


  const correct =
    thesis.resolved;


  switch(
    placement.field
  ){

    case "P1":

      return correct
        ? 1
        : 0;


    case "N1":

      return correct
        ? 0
        : 1;


    case "P3":

      return correct
        ? 3
        : -3;


    case "N3":

      return correct
        ? -3
        : 3;


    case "Q":

      return correct

        ? state.game.random_value

        : -state.game.random_value;

  }


  return 0;

}



function playerScore(
  userId
){

  let thesisTotal =
    0;


  let figureTotal =
    0;



  state.placements

    .filter(
      placement =>
        placement.user_id ===
        userId
    )

    .forEach(
      placement => {

        const thesis =
          state.theses.find(
            item =>
              item.id ===
              placement.thesis_id
          );


        thesisTotal +=
          thesisPoints(
            placement,
            thesis
          );

      }
    );



  state.figures

    .filter(
      figure =>
        figure.user_id ===
        userId
    )

    .forEach(
      figure => {

        figureTotal +=
          Number(
            figure.points ||
            0
          );

      }
    );



  return {

    thesis:
      thesisTotal,

    figures:
      figureTotal,

    total:
      thesisTotal +
      figureTotal

  };

}

function renderScoring(

  const score1 =

    playerScore(
      player2.user_id
    );

    score1.total ===
    score2.total

      : score1.total >
        score2.total

        ? `${
            player1
              .name
              .toUpperCase()
          } GEWINNT`

        : `${
            player2
              .name
              .toUpperCase()
          } GEWINNT`;



  return `


    ${
      finished

                winner

            </div>

          </div>

        `

    <div class="card score">


      <div>

        <strong>
          ${esc(
            player1.name
          )}
        </strong>

        <div class="points">
          ${score1.total}
        </div>

      </div>


      <div class="vs">
        :
      </div>


      <div>

        <strong>
          ${esc(
            player2.name
          )}

        <div class="points">
          ${score2.total}
        </div>

      </div>


    </div>



    <div class="grid2">


      ${state.players.map(
        player => {

          const score =
            playerScore(
              player.user_id
            );


          const placements =
            state.placements.filter(
              placement =>
                placement.user_id ===
                player.user_id
            );


          const figures =
            state.figures.filter(
              figure =>
                figure.user_id ===
                player.user_id
            );



          return `

            <div class="card">

              <h2>
                ${esc(
                  player.name
                )}
              </h2>


              <span class="badge">

                Thesen
                ${score.thesis}

              </span>


              <span class="badge">

                Figuren
                ${score.figures}

              </span>


              <hr>


              <h3>
                Thesen
              </h3>


              <div class="stack">

                ${placements.map(
                  placement => {

                    const thesis =
                      state.theses.find(
                        item =>
                          item.id ===
                          placement.thesis_id

                    const points =
                      thesisPoints(
                        placement,
                        thesis
                      );


                    return `

                      <div class="thesis">

                        <strong>

                          ${
                            fieldNames[
                              placement.field
                            ]
                          }

                          ·

                          ${
                            points >= 0
                              ? "+"
                              : ""
                          }

                          ${points}

                        </strong>


                        <div>

                          ${esc(
                            thesis.text
                          )}

                        </div>


                        ${
                          finished

                            ? `

                              <div class="muted">

                                ${
                                  thesis.resolved

                                    ? "✓ eingetreten"

                                    : "✕ nicht eingetreten"
                                }

                              </div>

                            `

                            : `

                              <div
                                class="row"
                                style="
                                  margin-top:8px
                                "
                              >

                                <button
                                  class="${
                                    thesis.resolved ===
                                    true

                                      ? "primary"

                                      : "ghost"
                                  }"

                                  onclick="
                                    resolveThesis(
                                      '${thesis.id}',
                                      true
                                    )
                                  "
                                >
                                  Eingetreten
                                </button>


                                <button
                                  class="${
                                    thesis.resolved ===
                                    false

                                      ? "primary"

                                      : "ghost"
                                  }"

                                  onclick="
                                    resolveThesis(
                                      '${thesis.id}',
                                      false
                                    )
                                  "
                                >
                                  Nicht eingetreten
                                </button>

                              </div>

                            `
                        }

                      </div>

                    `;

                  }
                ).join("")}

              </div>


              <hr>


              <h3>
                Figuren
              </h3>


              <div class="stack">

                ${figures.map(
                  figure => `

                    <div class="thesis">

                      <div>

                        <strong>

                          ${
                            figureNames[
                              figure.figure
                            ]
                          }

                        </strong>

                        ·

                        ${esc(
                          figure.footballer
                        )}

                      </div>


                      <div
                        class="row"
                        style="
                          margin-top:8px
                        "
                      >

                        ${
                          finished

                            ? `

                              <strong>

                                ${
                                  figure.points >= 0
                                    ? "+"
                                    : ""
                                }

                                ${figure.points}

                                Punkte

                              </strong>

                            `

                            : `

                              <button
                                class="ghost"

                                onclick="
                                  setFigurePoints(
                                    '${figure.id}',
                                    ${
                                      Number(
                                        figure.points
                                      ) - 1
                                    }
                                  )
                                "
                              >
                                −
                              </button>


                              <strong>

                                ${
                                  Number(
                                    figure.points
                                  ) >= 0
                                    ? "+"
                                    : ""
                                }

                                ${figure.points}

                              </strong>


                              <button
                                class="ghost"

                                onclick="
                                  setFigurePoints(
                                    '${figure.id}',
                                    ${
                                      Number(
                                        figure.points
                                      ) + 1
                                    }
                                  )
                                "
                              >
                                +
                              </button>

                            `
                        }

                      </div>

                    </div>

                  `
                ).join("")}

              </div>

            </div>

          `;

        }
      ).join("")}

    </div>



    ${
      !finished

        ? `

          <div class="card">

            <button
              class="primary"

              onclick="
                finishGame()
              "
            >
              Abpfiff
            </button>

          </div>

        `

        : `

          <div class="card">

            ${
              isMainAccount()

                ? `

                    onclick="
                      goHome()

                    Zur Lobbyübersicht
                  </button>

                `

                : `

                  <strong>
                    Spiel beendet.
                  </strong>

                `
            }

          </div>

        `
    }

  `;

}
