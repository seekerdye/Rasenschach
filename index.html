<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Rasenschach Bundesliga</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#10281f;
  --panel:#17372b;
  --panel2:#1d4435;
  --dark:#0a1712;
  --cream:#f3eedf;
  --muted:#b7c6bd;
  --line:#315747;
  --accent:#d8ff69;
  --danger:#ff816f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #24503f 0,
      #10281f 45%,
      #09140f 100%
    );

  color:var(--cream);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  width:min(
    1150px,
    calc(100% - 24px)
  );

  margin:auto;

  padding:20px 0 60px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:12px;

  margin-bottom:18px;
}

.brand{
  font-size:clamp(25px,5vw,42px);

  font-weight:900;

  letter-spacing:-.04em;
}

.brand span{
  color:var(--accent);
}

.headerActions{
  display:flex;

  align-items:center;
  justify-content:flex-end;

  flex-wrap:wrap;

  gap:6px;

  color:var(--muted);

  font-size:13px;
}

.card{
  background:
    rgba(
      23,
      55,
      43,
      .95
    );

  border:
    1px solid
    var(--line);

  border-radius:20px;

  padding:18px;

  margin:12px 0;

  box-shadow:
    0 18px 60px
    rgba(0,0,0,.18);
}

.grid2{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;
}

.grid3{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

.matchdayGrid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin-top:15px;
}

@media(max-width:950px){

  .matchdayGrid{
    grid-template-columns:
      repeat(3,1fr);
  }

}

@media(max-width:760px){

  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  .matchdayGrid{
    grid-template-columns:
      repeat(2,1fr);
  }

  header{
    align-items:flex-start;
  }

}

@media(max-width:430px){

  .matchdayGrid{
    grid-template-columns:1fr;
  }

}

h1,
h2,
h3,
p{
  margin-top:0;
}

h1{
  letter-spacing:-.03em;
}

h2{
  font-size:20px;
}

.muted{
  color:var(--muted);
}

.success{
  color:var(--accent);
}

.error{
  color:var(--danger);
}

input,
select{
  width:100%;

  background:var(--dark);

  color:var(--cream);

  border:1px solid var(--line);

  border-radius:12px;

  padding:12px;

  outline:none;
}

input:focus,
select:focus{
  border-color:var(--accent);
}

button{
  border:0;

  border-radius:12px;

  padding:11px 14px;

  background:var(--cream);

  color:#102018;

  font-weight:800;
}

button.primary{
  background:var(--accent);
}

button.ghost{
  background:transparent;

  color:var(--cream);

  border:1px solid var(--line);
}

button.danger{
  background:transparent;

  color:var(--danger);

  border:
    1px solid
    rgba(255,129,111,.4);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.row{
  display:flex;

  gap:8px;

  align-items:center;

  flex-wrap:wrap;
}

.stack{
  display:grid;

  gap:10px;
}

.thesis{
  background:#0d2119;

  border:1px solid var(--line);

  border-radius:14px;

  padding:13px;
}

.badge{
  display:inline-flex;

  align-items:center;

  gap:5px;

  padding:5px 9px;

  border-radius:100px;

  background:#0c2119;

  border:1px solid var(--line);

  color:var(--muted);

  font-size:12px;

  margin:2px;
}

.lobbyCard{
  display:flex;

  flex-direction:column;

  min-height:235px;
}

.lobbyName{
  font-size:22px;

  font-weight:900;

  margin-top:12px;
}

.lobbyCode{
  color:var(--muted);

  font-size:13px;

  margin-top:4px;
}

.actions{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:auto;

  padding-top:15px;
}

.matchday{
  background:#0d2119;

  border:1px solid var(--line);

  border-radius:15px;

  padding:13px;

  min-height:155px;

  display:flex;

  flex-direction:column;
}

.matchdayNumber{
  font-size:22px;

  font-weight:900;
}

.matchday .actions{
  margin-top:auto;
}

.turn{
  background:var(--accent);

  color:#102018;

  border-radius:14px;

  padding:13px;

  font-weight:900;

  text-align:center;

  margin-bottom:12px;
}

.phasebar{
  display:flex;

  gap:6px;

  overflow-x:auto;

  margin-bottom:14px;

  scrollbar-width:none;
}

.phasebar::-webkit-scrollbar{
  display:none;
}

.phasebar span{
  white-space:nowrap;

  padding:7px 10px;

  border-radius:99px;

  background:#0b1d16;

  color:#7d9488;

  font-size:12px;
}

.phasebar span.active{
  background:var(--accent);

  color:#102018;

  font-weight:800;
}

.fields{
  display:grid;

  gap:8px;
}

.field{
  display:grid;

  grid-template-columns:
    70px 1fr;

  align-items:center;

  gap:10px;

  background:#0c2119;

  border:1px solid var(--line);

  border-radius:14px;

  padding:10px;
}

.fieldLabel{
  font-size:22px;

  font-weight:900;

  text-align:center;
}

.fieldButtons{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:10px;
}

.fieldButton{
  background:transparent;

  color:var(--cream);

  border:1px solid var(--line);

  min-width:52px;
}

.fieldButton:hover{
  border-color:var(--accent);

  color:var(--accent);
}

.drawCard{
  text-align:center;
}

.drawWinner{
  color:var(--accent);

  font-size:clamp(25px,6vw,42px);

  font-weight:900;
}

.score{
  display:grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items:center;

  gap:14px;

  text-align:center;
}

.points{
  font-size:clamp(34px,8vw,64px);

  font-weight:900;
}

.vs{
  color:var(--muted);

  font-size:24px;

  font-weight:900;
}

.bigResult{
  text-align:center;

  font-size:clamp(32px,8vw,70px);

  font-weight:900;
}

hr{
  border:0;

  border-top:1px solid var(--line);

  margin:18px 0;
}

.footer{
  margin-top:40px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

.loading{
  padding:60px 20px;

  text-align:center;

  color:var(--muted);
}

#toast{
  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  max-width:calc(100% - 30px);

  padding:10px 16px;

  border-radius:100px;

  background:var(--cream);

  color:#102018;

  font-weight:800;

  text-align:center;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:1000;
}

#toast.show{
  opacity:1;
}

</style>

</head>


<body>


<div class="shell">

<header>

  <div class="brand">
    RASEN<span>SCHACH</span>
  </div>

  <div
    id="headerActions"
    class="headerActions"
  ></div>

</header>


<main id="app">

  <div class="loading">
    Rasenschach wird geladen …
  </div>

</main>


<div class="footer">
  Rasenschach Bundesliga · Fan-Projekt
</div>

</div>


<div id="toast"></div>


<script>


/* =========================================================
   SUPABASE
========================================================= */


const SUPABASE_URL =
  "https://myqerixfnmjgvgwculiw.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_dr_f5ic0-aiiY3wSkX_Rng_1Ye3Vy73";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );



/* =========================================================
   STATE
========================================================= */


let state = {

  user:null,

  lobbyId:null,
  lobby:null,
  lobbyPlayers:[],
  matchdayGames:[],

  myLobbies:[],
  myLobbyPlayers:[],

  gameId:null,
  game:null,
  players:[],
  theses:[],
  placements:[],
  figures:[],
  me:null,

  channel:null

};



/* =========================================================
   KONSTANTEN
========================================================= */


const fieldNames = {

  P1:"+1",

  N1:"−1",

  P3:"±3",

  N3:"∓3",

  Q:"?"

};


const figureSequence = [
  1,2,2,1,1,
  2,2,1,1,2
];


const figureNames = {

  KING:"♔ König",

  QUEEN:"♕ Dame",

  ROOK:"♖ Turm",

  BISHOP:"♗ Läufer",

  KNIGHT:"♘ Springer"

};


const statusNames = {

  lobby:"Vorbereitung",

  thesis_draft:"Thesendraft",

  figure_draft:"Figurendraft",

  scoring:"Auswertung",

  finished:"Beendet"

};


const phases = [

  ["lobby","Vorbereitung"],

  ["thesis_draft","Thesendraft"],

  ["figure_draft","Figurendraft"],

  ["scoring","Auswertung"],

  ["finished","Ergebnis"]

];



/* =========================================================
   HELPERS
========================================================= */


function esc(value){

  return String(
    value ?? ""
  )

  .replaceAll("&","&amp;")

  .replaceAll("<","&lt;")

  .replaceAll(">","&gt;")

  .replaceAll('"',"&quot;");

}



function toast(message){

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    message;


  element.classList.add(
    "show"
  );


  setTimeout(
    () =>
      element.classList.remove(
        "show"
      ),
    2300
  );

}



function errorMessage(error){

  console.error(error);

  toast(
    error?.message ||
    "Etwas ist schiefgelaufen"
  );

}



function appBase(){

  return (
    location.origin +
    location.pathname
  );

}



function goHome(){

  location.href =
    appBase();

}



function openLobby(id){

  location.href =
    appBase() +
    "?lobby=" +
    encodeURIComponent(id);

}



function openGame(id){

  location.href =
    appBase() +
    "?game=" +
    encodeURIComponent(id);

}



function inviteUrl(code){

  return (
    appBase() +
    "?room=" +
    encodeURIComponent(code)
  );

}



function isMainAccount(){

  return Boolean(
    state.user?.email
  );

}



function accountName(){

  return (

    state.user
      ?.user_metadata
      ?.display_name

    ||

    state.user
      ?.email
      ?.split("@")[0]

    ||

    ""

  );

}



async function copyLobbyInvite(code){

  try{

    await navigator.clipboard
      .writeText(
        inviteUrl(code)
      );


    toast(
      "Einladungslink kopiert"
    );

  }

  catch{

    toast(
      "Link konnte nicht kopiert werden"
    );

  }

}



function draftedTheses(){

  return state.theses.filter(
    thesis =>
      thesis.drafted_by
  );

}



function currentThesisSeat(){

  const count =
    draftedTheses().length;


  const starter =
    state.game
      ?.thesis_start_seat
    ||
    1;


  const sequence =

    starter === 1

      ? [
          1,2,2,1,1,
          2,2,1,1,2
        ]

      : [
          2,1,1,2,2,
          1,1,2,2,1
        ];


  return (
    sequence[count]
    ??
    null
  );

}



function currentFigureSeat(){

  return (
    figureSequence[
      state.figures.length
    ]
    ??
    null
  );

}



function phaseBar(){

  return `

    <div class="phasebar">

      ${
        phases.map(
          ([id,label]) => `

            <span
              class="${
                state.game?.status === id
                  ? "active"
                  : ""
              }"
            >
              ${label}
            </span>

          `
        ).join("")
      }

    </div>

  `;

}



/* =========================================================
   AUTH
========================================================= */


async function removeAnonymousSession(){

  if(
    state.user &&
    !state.user.email
  ){

    await db.auth.signOut({
      scope:"local"
    });


    state.user = null;

  }

}



async function registerMainPlayer(){

  try{

    const name =
      document
        .getElementById(
          "authName"
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          "authEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById(
          "authPassword"
        )
        .value;


    if(
      !name ||
      !email ||
      !password
    ){

      toast(
        "Name, E-Mail und Passwort eingeben"
      );

      return;

    }


    await removeAnonymousSession();


    const {
      data,
      error
    } =
      await db.auth.signUp({

        email,

        password,

        options:{

          data:{
            display_name:name
          },

          emailRedirectTo:
            appBase()

        }

      });


    if(error){
      throw error;
    }


    if(data.session){

      state.user =
        data.session.user;


      goHome();

    }

    else{

      document.getElementById(
        "authMessage"
      ).innerHTML = `

        <div class="success">

          ✓ Konto erstellt.
          Bitte bestätige deine E-Mail.

        </div>

      `;

    }

  }

  catch(error){

    errorMessage(error);

  }

}



async function loginMainPlayer(){

  try{

    const email =
      document
        .getElementById(
          "authEmail"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById(
          "authPassword"
        )
        .value;


    if(
      !email ||
      !password
    ){

      toast(
        "E-Mail und Passwort eingeben"
      );

      return;

    }


    await removeAnonymousSession();


    const {
      data,
      error
    } =
      await db.auth.signInWithPassword({
        email,
        password
      });


    if(error){
      throw error;
    }


    state.user =
      data.user;


    goHome();

  }

  catch(error){

    errorMessage(error);

  }

}



async function logoutMainPlayer(){

  await db.auth.signOut({
    scope:"local"
  });


  state.user = null;


  goHome();

}



async function ensureGuestSession(){

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();


  if(session){

    state.user =
      session.user;

    return;

  }


  const {
    data,
    error
  } =
    await db.auth
      .signInAnonymously();


  if(error){
    throw error;
  }


  state.user =
    data.session.user;

}



/* =========================================================
   BOOT
========================================================= */


async function boot(){

  try{

    const {
      data:{
        session
      }
    } =
      await db.auth
        .getSession();


    state.user =
      session?.user
      ||
      null;


    const params =
      new URLSearchParams(
        location.search
      );


    const lobbyId =
      params.get("lobby");


    const gameId =
      params.get("game");


    const room =
      params
        .get("room")
        ?.trim()
        .toUpperCase();



    if(gameId){

      if(!state.user){

        renderLogin();

        return;

      }


      state.gameId =
        gameId;


      await refreshGame();


      subscribeGame();


      return;

    }



    if(lobbyId){

      if(!state.user){

        renderLogin();

        return;

      }


      state.lobbyId =
        lobbyId;


      await refreshLobby();


      subscribeLobby();


      return;

    }



    if(room){

      renderStartPage(
        room
      );

      return;

    }



    if(isMainAccount()){

      await loadDashboard();

      return;

    }



    renderStartPage("");

  }

  catch(error){

    console.error(error);


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="card">

        <h2>
          Fehler
        </h2>

        <p class="error">
          ${esc(error.message)}
        </p>

        <button
          onclick="goHome()"
        >
          Startseite
        </button>

      </div>

    `;

  }

}



/* =========================================================
   START / LOGIN
========================================================= */


function renderAuthCard(){

  return `

    <div class="card">

      <h2>
        Hauptspieler
      </h2>

      <p class="muted">

        Melde dich an,
        um deine Bundesliga-Lobbys
        auf allen Geräten zu sehen.

      </p>


      <div class="stack">

        <input
          id="authName"
          placeholder="Anzeigename"
        >

        <input
          id="authEmail"
          type="email"
          placeholder="E-Mail"
        >

        <input
          id="authPassword"
          type="password"
          placeholder="Passwort"
        >

        <button
          class="primary"
          onclick="loginMainPlayer()"
        >
          Einloggen
        </button>

        <button
          class="ghost"
          onclick="registerMainPlayer()"
        >
          Konto erstellen
        </button>

        <div
          id="authMessage"
          class="muted"
        ></div>

      </div>

    </div>

  `;

}



function renderStartPage(room=""){

  document.getElementById(
    "headerActions"
  ).innerHTML = "";


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h1>
        Rasenschach Bundesliga
      </h1>

      <p class="muted">

        Eine Lobby.
        Zwei Spieler.
        34 Bundesliga-Spieltage.

      </p>

    </div>


    <div class="grid2">

      ${
        isMainAccount()

          ? `

            <div class="card">

              <h2>
                ${esc(accountName())}
              </h2>

              <p class="muted">
                ${esc(state.user.email)}
              </p>

              <button
                class="primary"
                onclick="goHome()"
              >
                Meine Lobbys
              </button>

            </div>

          `

          : renderAuthCard()
      }


      <div class="card">

        <h2>
          Lobby beitreten
        </h2>

        <p class="muted">
          Spieler 2 benötigt keinen Account.
        </p>

        <div class="stack">

          <input
            id="joinName"
            placeholder="Dein Name"
          >

          <input
            id="joinCode"
            maxlength="6"
            placeholder="Lobby-Code"
            value="${esc(room)}"
          >

          <button
            onclick="joinLobby()"
          >
            Beitreten
          </button>

        </div>

      </div>

    </div>

  `;

function renderLogin(){

  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">
      <h2>Anmeldung erforderlich</h2>
    </div>

    ${renderAuthCard()}

  `;

}



/* =========================================================
   DASHBOARD
========================================================= */


async function loadDashboard(){

  const membership =
    await db
      .from("lobby_players")
      .select(
        "lobby_id,user_id,seat,name"
      )
      .eq(
        "user_id",
        state.user.id
      );


  if(membership.error){
    throw membership.error;
  }


  const entries =
    membership.data || [];


  if(!entries.length){

    state.myLobbies = [];
    state.myLobbyPlayers = [];

    renderDashboard();

    return;

  }


  const ids = [
    ...new Set(
      entries.map(
        item =>
          item.lobby_id
      )
    )
  ];


  const [
    lobbiesResult,
    playersResult
  ] =
    await Promise.all([

      db
        .from("lobbies")
        .select("*")
        .in("id",ids)
        .order(
          "created_at",
          {
            ascending:false
          }
        ),

      db
        .from("lobby_players")
        .select("*")
        .in("lobby_id",ids)
        .order("seat")

    ]);


  if(lobbiesResult.error){
    throw lobbiesResult.error;
  }


  if(playersResult.error){
    throw playersResult.error;
  }


  state.myLobbies =
    lobbiesResult.data || [];


  state.myLobbyPlayers =
    playersResult.data || [];


  renderDashboard();

}



function renderDashboard(){

  document.getElementById(
    "headerActions"
  ).innerHTML = `

    <span>
      ${esc(state.user.email)}
    </span>

    <button
      class="ghost"
      onclick="logoutMainPlayer()"
    >
      Abmelden
    </button>

  `;


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h1>
        Meine Bundesliga-Lobbys
      </h1>

      <p class="muted">

        Jede Lobby enthält
        die Spieltage 1 bis 34.

      </p>

    </div>


    <div class="card">

      <h2>
        Neue Lobby
      </h2>

      <div class="grid2">

        <input
          id="createPlayerName"
          value="${esc(accountName())}"
          placeholder="Dein Spielername"
        >

        <input
          id="createLobbyName"
          placeholder="Lobbyname, z. B. Max vs. Ich"
        >

      </div>

async function createLobby(){

  try{

      document
        .getElementById(
          "createPlayerName"
        )
        .value
        .trim();


    const lobbyName =
      document
        .getElementById(
          "createLobbyName"
        )
        .value
        .trim();


    if(!playerName){

      toast(
        "Spielername eingeben"
      );

      return;

    }


    const {
      data,
      error
    } =
      await db.rpc(
        "create_lobby",
        {

          p_player_name:
            playerName,

          p_lobby_name:
            lobbyName

        }
      );


    if(error){
      throw error;
    }


    openLobby(
      data[0].lobby_id
    );

  }

  catch(error){

    errorMessage(error);

  }

}



async function joinLobby(){

  try{

    const name =
      document
        .getElementById(
          "joinName"
        )
        .value
        .trim();


    const code =
      document
        .getElementById(
          "joinCode"
        )
        .value
        .trim()
        .toUpperCase();


    if(
      !name ||
      !code
    ){

      toast(
        "Name und Lobby-Code eingeben"
      );

      return;

    }


    await ensureGuestSession();


    const {
      data,
      error
    } =
      await db.rpc(
        "join_lobby",
        {

          p_code:code,

          p_name:name

        }
      );


    if(error){
      throw error;
    }


    openLobby(
      data[0].lobby_id
    );

  }

  catch(error){

    errorMessage(error);

  }

}



async function renameLobby(
  id,
  currentName
){

  const newName =
    prompt(
      "Neuer Lobbyname:",
      currentName
    );


  if(
    newName === null
  ){
    return;
  }


  if(
    !newName.trim()
  ){

    toast(
      "Lobbyname darf nicht leer sein"
    );

    return;

  }


  try{

    const {
      error
    } =
      await db.rpc(
        "rename_lobby",
        {

          p_lobby_id:id,

          p_name:
            newName.trim()

        }
      );


    if(error){
      throw error;
    }


    toast(
      "Lobby umbenannt"
    );


    if(
      state.lobbyId === id
    ){

      await refreshLobby();

    }

    else{

      await loadDashboard();

    }

  }

  catch(error){

    errorMessage(error);

  }

}



async function deleteLobby(
  id,
  name
){

  const confirmed =
    confirm(
      `Lobby "${name}" wirklich löschen?\n\nAlle Spieltage, Thesen, Drafts und Ergebnisse dieser Lobby werden ebenfalls gelöscht.`
    );


  if(!confirmed){
    return;
  }


  try{

    const {
      error
    } =
      await db.rpc(
        "delete_lobby",
        {
          p_lobby_id:id
        }
      );


    if(error){
      throw error;
    }


    toast(
      "Lobby gelöscht"
    );


    goHome();

  }

  catch(error){

    errorMessage(error);

  }

}

      db
        .from("lobby_players")
        .select("*")
        .eq(
          "lobby_id",
          state.lobbyId
        )
        .order("seat"),

      db
        .from("games")
        .select(
          "id,lobby_id,matchday,status,created_at"

        .eq(
          "lobby_id",
          state.lobbyId

async function refreshGame(){

  const [
    gameResult,
    playersResult,
    thesesResult,
    placementsResult,
    figuresResult
  ] =
    await Promise.all([

      db
        .from("games")
        .select("*")
        .eq(
          "id",
          state.gameId
        )
        .single(),

      db
        .from("players")
        .select("*")
        .eq(
          "game_id",
          state.gameId
        )
        .order("seat"),

      db
        .from("theses")
        .select("*")
        .eq(
          "game_id",
          state.gameId
        )
        .order("created_at"),

      db
        .from("placements")
        .select("*")
        .eq(
          "game_id",
          state.gameId
        ),

      db
        .from("figure_picks")
        .select("*")
        .eq(
          "game_id",
          state.gameId
        )
        .order("draft_order")

    ]);


  if(gameResult.error){
    throw gameResult.error;
  }


  if(playersResult.error){
    throw playersResult.error;
  }


  if(thesesResult.error){
    throw thesesResult.error;
  }


  if(placementsResult.error){
    throw placementsResult.error;
  }


  if(figuresResult.error){
    throw figuresResult.error;
  }


  state.game =
    gameResult.data;


  state.players =
    playersResult.data || [];


  state.theses =
    thesesResult.data || [];


  state.placements =
    placementsResult.data || [];


  state.figures =
    figuresResult.data || [];


  state.me =
    state.players.find(
      player =>
        player.user_id ===
        state.user.id
    );


  if(!state.me){

    throw new Error(
      "Du bist kein Spieler dieses Spieltags."
    );

  }


  renderGame();

}



/* =========================================================
   REALTIME
========================================================= */


let refreshTimer;


function scheduleGameRefresh(){

  clearTimeout(
    refreshTimer
  );


  refreshTimer =
    setTimeout(
      () =>
        refreshGame()
          .catch(
            errorMessage
          ),
      140
    );

}



function subscribeGame(){

  if(state.channel){

    db.removeChannel(
      state.channel
    );

  }


  const channel =
    db.channel(
      `game-${state.gameId}`
    );


  [
    "games",
    "players",
    "theses",
    "placements",
    "figure_picks"
  ].forEach(
    table => {

      channel.on(

        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table,

          filter:

            table === "games"

              ? `id=eq.${state.gameId}`

              : `game_id=eq.${state.gameId}`
        },

        scheduleGameRefresh

      );

    }
  );


  channel.subscribe();


  state.channel =
    channel;

}



function scheduleLobbyRefresh(){

  clearTimeout(
    refreshTimer
  );


  refreshTimer =
    setTimeout(
      () =>
        refreshLobby()
          .catch(
            errorMessage
          ),
      140
    );

}



function subscribeLobby(){

  if(state.channel){

    db.removeChannel(
      state.channel
    );

  }


  const channel =
    db.channel(
      `lobby-${state.lobbyId}`
    );


  channel.on(

    "postgres_changes",

    {
      event:"*",
      schema:"public",
      table:"lobbies",
      filter:`id=eq.${state.lobbyId}`
    },

    scheduleLobbyRefresh

  );


  channel.on(

    "postgres_changes",

    {
      event:"*",
      schema:"public",
      table:"lobby_players",
      filter:`lobby_id=eq.${state.lobbyId}`
    },

    scheduleLobbyRefresh

  );


  channel.on(

    "postgres_changes",

    {
      event:"*",
      schema:"public",
      table:"games",
      filter:`lobby_id=eq.${state.lobbyId}`
    },

    scheduleLobbyRefresh

  );


  channel.subscribe();


  state.channel =
    channel;

}

          }

        </div>


        <div class="card">

          <h2>
            Draftverlauf
          </h2>


          ${
            state.players.map(
              player => {

                const picks =
                  draftedTheses()

                    .filter(
                      thesis =>
                        thesis.drafted_by ===
                        player.user_id
                    )

                    .sort(
                      (a,b) =>
                        a.draft_order -
                        b.draft_order
                    );


                return `

                  <h3>
                    ${esc(player.name)}
                  </h3>


                  ${
                    picks.length

                      ? picks.map(
                          thesis => {

                            const placement =
                              state.placements.find(
                                item =>
                                  item.thesis_id ===
                                  thesis.id
                              );


                            return `

                              <div class="thesis">

                                <span class="badge">

                                  ${
                                    placement
                                      ? fieldNames[
                                          placement.field
                                        ]
                                      : "?"
                                  }

                                </span>

                                ${esc(thesis.text)}

                              </div>

                            `;

                          }
                        ).join("")

                      : `

                        <span class="muted">
                          Noch kein Pick
                        </span>

                      `
                  }

                  <hr>

                `;

              }
            ).join("")
          }

        </div>

      </div>

    </div>

  `;

}



async function pickThesis(
  id,
  field
){

  try{

    const {
      error
    } =
      await db.rpc(
        "pick_thesis",
        {

          p_game_id:
            state.gameId,

          p_thesis_id:
            id,

          p_field:
            field

        }
      );


    if(error){
      throw error;
    }

  }

  catch(error){

    errorMessage(error);

  }

}



/* =========================================================
   BRETT
========================================================= */


function renderBoard(userId){

  const placements =
    state.placements.filter(
      placement =>
        placement.user_id ===
        userId
    );


  return `

    <div class="fields">

      ${
        Object.keys(fieldNames)
          .map(
            field => {

              const placement =
                placements.find(
                  item =>
                    item.field === field
                );


              const thesis =
                placement

                  ? state.theses.find(
                      item =>
                        item.id ===
                        placement.thesis_id
                    )

                  : null;


              return `

                <div class="field">

                  <div class="fieldLabel">
                    ${fieldNames[field]}
                  </div>

                  <div>

                    ${
                      thesis

                        ? esc(thesis.text)

                        : "frei"
                    }

                  </div>

                </div>

              `;

            }
          ).join("")
      }

    </div>

  `;

}



/* =========================================================
   FIGURENDRAFT
========================================================= */


function renderFigureDraft(){

  const seat =
    currentFigureSeat();


  const activePlayer =
    state.players.find(
      player =>
        player.seat === seat
    );


  const mine =
    state.figures.filter(
      figure =>
        figure.user_id ===
        state.user.id
    );


  const freeFigures =
    Object.keys(figureNames)
      .filter(
        figure =>
          !mine.some(
            item =>
              item.figure === figure
          )
      );


  return `

    <div class="card">

      <h2>
        Thesenbretter
      </h2>

      <div class="grid2">

        ${
          state.players.map(
            player => `

              <div>

                <h3>
                  ${esc(player.name)}
                </h3>

                ${renderBoard(
                  player.user_id
                )}

              </div>

            `
          ).join("")
        }

      </div>

    </div>


    <div class="turn">

      ${
        seat === state.me.seat

          ? "Du bist beim Figurendraft am Zug"

          : `${esc(
              activePlayer?.name || ""
            )} ist am Zug`
      }

    </div>


    <div class="grid2">

      <div class="card">

        <h2>
          Fußballer auswählen
        </h2>


        ${
          seat === state.me.seat

            ? `

              <div class="stack">

                <select
                  id="figureSelect"
                >

                  ${
                    freeFigures.map(
                      figure => `

                        <option
                          value="${figure}"
                        >

                          ${figureNames[figure]}

                        </option>

                      `
                    ).join("")
                  }

                </select>


                <input
                  id="footballerInput"
                  placeholder="Fußballer"
                >


                <input
                  id="clubInput"
                  placeholder="Verein (optional)"
                >


                <button
                  class="primary"
                  onclick="pickFigure()"
                >
                  Draften
                </button>

              </div>

            `

            : `

              <p class="muted">
                Gegner ist am Zug.
              </p>

            `
        }

      </div>


      <div class="card">

        <h2>
          Figuren
        </h2>


        ${
          state.players.map(
            player => {

              const figures =
                state.figures.filter(
                  figure =>
                    figure.user_id ===
                    player.user_id
                );


              return `

                <h3>
                  ${esc(player.name)}
                </h3>


                ${
                  Object.keys(figureNames)
                    .map(
                      figure => {

                        const pick =
                          figures.find(
                            item =>
                              item.figure ===
                              figure
                          );


                        return `

                          <div class="thesis">

                            <strong>
                              ${figureNames[figure]}
                            </strong>

                            <div class="muted">

                              ${
                                pick

                                  ? esc(
                                      pick.footballer
                                    )

                                  : "frei"
                              }

                            </div>

                          </div>

                        `;

                      }
                    ).join("")
                }

                <hr>

              `;

            }
          ).join("")
        }

      </div>

    </div>

  `;

}



async function pickFigure(){

  const figure =
    document.getElementById(
      "figureSelect"
    ).value;


  const footballer =
    document.getElementById(
      "footballerInput"
    ).value.trim();


  const club =
    document.getElementById(
      "clubInput"
    ).value.trim();


  if(!footballer){

    toast(
      "Fußballer eingeben"
    );

    return;

  }


  const {
    error
  } =
    await db.rpc(
      "pick_figure",
      {

        p_game_id:
          state.gameId,

        p_figure:
          figure,

        p_footballer:
          footballer,

        p_club:
          club || null

      }
    );


  if(error){
    errorMessage(error);
  }

}



/* =========================================================
   PUNKTE
========================================================= */


function thesisPoints(
  placement,
  thesis
){

  if(
    thesis?.resolved === null
    ||
    thesis?.resolved === undefined
  ){

    return 0;

  }


  const correct =
    thesis.resolved;


  switch(
    placement.field
  ){

    case "P1":

      return correct
        ? 1
        : 0;


    case "N1":

      return correct
        ? 0
        : 1;


    case "P3":

      return correct
        ? 3
        : -3;


    case "N3":

      return correct
        ? -3
        : 3;


    case "Q":

      return correct

        ? state.game.random_value

        : -state.game.random_value;

  }


  return 0;

}



function playerScore(userId){

  let thesisTotal = 0;
  let figureTotal = 0;


  state.placements

    .filter(
      placement =>
        placement.user_id ===
        userId
    )

    .forEach(
      placement => {

        const thesis =
          state.theses.find(
            item =>
              item.id ===
              placement.thesis_id
          );


        thesisTotal +=
          thesisPoints(
            placement,
            thesis
          );

      }
    );


  state.figures

    .filter(
      figure =>
        figure.user_id ===
        userId
    )

    .forEach(
      figure => {

        figureTotal +=
          Number(
            figure.points || 0
          );

      }
    );


  return {

    thesis:
      thesisTotal,

    figures:
      figureTotal,

    total:
      thesisTotal +
      figureTotal

  };

}



/* =========================================================
   AUSWERTUNG
========================================================= */


function renderScoring(finished){

  const player1 =
    state.players[0];


  const player2 =
    state.players[1];


  const score1 =
    playerScore(
      player1.user_id
    );


  const score2 =
    playerScore(
      player2.user_id
    );


  const winner =

    score1.total ===
    score2.total

      ? "UNENTSCHIEDEN"

      : score1.total >
        score2.total

        ? `${player1.name.toUpperCase()} GEWINNT`

        : `${player2.name.toUpperCase()} GEWINNT`;


  return `

    ${
      finished

        ? `

          <div class="card">

            <div class="bigResult">
              ${esc(winner)}
            </div>

          </div>

        `

        : ""
    }


    <div class="card score">

      <div>

        <strong>
          ${esc(player1.name)}
        </strong>

        <div class="points">
          ${score1.total}
        </div>

      </div>


      <div class="vs">
        :
      </div>


      <div>

        <strong>
          ${esc(player2.name)}
        </strong>

        <div class="points">
          ${score2.total}
        </div>

      </div>

    </div>


    <div class="grid2">

      ${
        state.players.map(
          player => {

            const placements =
              state.placements.filter(
                placement =>
                  placement.user_id ===
                  player.user_id
              );


            const figures =
              state.figures.filter(
                figure =>
                  figure.user_id ===
                  player.user_id
              );


            return `

              <div class="card">

                <h2>
                  ${esc(player.name)}
                </h2>


                <h3>Thesen</h3>


                ${
                  placements.map(
                    placement => {

                      const thesis =
                        state.theses.find(
                          item =>
                            item.id ===
                            placement.thesis_id
                        );


                      const points =
                        thesisPoints(
                          placement,
                          thesis
                        );


                      return `

                        <div class="thesis">

                          <strong>

                            ${fieldNames[
                              placement.field
                            ]}

                            ·

                            ${
                              points >= 0
                                ? "+"
                                : ""
                            }${points}

                          </strong>


                          <p>
                            ${esc(thesis.text)}
                          </p>


                          ${
                            finished

                              ? `

                                <span class="muted">

                                  ${
                                    thesis.resolved

                                      ? "✓ eingetreten"

                                      : "✕ nicht eingetreten"
                                  }

                                </span>

                              `

                              : `

                                <div class="row">

                                  <button
                                    onclick="
                                      resolveThesis(
                                        '${thesis.id}',
                                        true
                                      )
                                    "
                                  >
                                    Eingetreten
                                  </button>

                                  <button
                                    class="ghost"
                                    onclick="
                                      resolveThesis(
                                        '${thesis.id}',
                                        false
                                      )
                                    "
                                  >
                                    Nicht eingetreten
                                  </button>

                                </div>

                              `
                          }

                        </div>

                      `;

                    }
                  ).join("")
                }


                <hr>


                <h3>Figuren</h3>


                ${
                  figures.map(
                    figure => `

                      <div class="thesis">

                        <strong>

                          ${figureNames[
                            figure.figure
                          ]}

                          ·

                          ${esc(
                            figure.footballer
                          )}

                        </strong>


                        ${
                          finished

                            ? `

                              <p>

                                ${
                                  figure.points >= 0
                                    ? "+"
                                    : ""
                                }${figure.points}

                                Punkte

                              </p>

                            `

                            : `

                              <div
                                class="row"
                                style="margin-top:10px"
                              >

                                <button
                                  class="ghost"
                                  onclick="
                                    setFigurePoints(
                                      '${figure.id}',
                                      ${
                                        Number(
                                          figure.points
                                        ) - 1
                                      }
                                    )
                                  "
                                >
                                  −
                                </button>


                                <strong>
                                  ${figure.points}
                                </strong>


                                <button
                                  class="ghost"
                                  onclick="
                                    setFigurePoints(
                                      '${figure.id}',
                                      ${
                                        Number(
                                          figure.points
                                        ) + 1
                                      }
                                    )
                                  "
                                >
                                  +
                                </button>

                              </div>

                            `
                        }

                      </div>

                    `
                  ).join("")
                }

              </div>

            `;

          }
        ).join("")
      }

    </div>


    ${
      !finished

        ? `

          <div class="card">

            <button
              class="primary"
              onclick="finishGame()"
            >
              Abpfiff
            </button>

          </div>

        `

        : `

          <div class="card">

            <button
              class="primary"
              onclick="
                openLobby(
                  '${state.game.lobby_id}'
                )
              "
            >
              Zur Saisonübersicht
            </button>

          </div>

        `
    }

  `;

}



async function resolveThesis(
  id,
  value
){

  const {
    error
  } =
    await db.rpc(
      "resolve_thesis",
      {

        p_thesis_id:id,

        p_resolved:value

      }
    );


  if(error){
    errorMessage(error);
  }

}



async function setFigurePoints(
  id,
  points
){

  const {
    error
  } =
    await db.rpc(
      "set_figure_points",
      {

        p_pick_id:id,

        p_points:points

      }
    );


  if(error){
    errorMessage(error);
  }

}



async function finishGame(){

  const {
    error
  } =
    await db.rpc(
      "finish_game",
      {

        p_game_id:
          state.gameId

      }
    );


  if(error){
    errorMessage(error);
  }

}



/* =========================================================
   START
========================================================= */


boot();


</script>
