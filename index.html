<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Rasenschach Bundesliga</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#10281f;
  --panel:#17372b;
  --dark:#0a1712;
  --cream:#f3eedf;
  --muted:#b7c6bd;
  --line:#315747;
  --accent:#d8ff69;
  --danger:#ff816f;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#24503f 0,#10281f 45%,#09140f 100%);
  color:var(--cream);
}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

.shell{
  width:min(1150px,calc(100% - 24px));
  margin:auto;
  padding:20px 0 60px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.brand{
  font-size:clamp(25px,5vw,42px);
  font-weight:900;
  letter-spacing:-.04em;
}

.brand span{color:var(--accent)}

.headerActions{
  display:flex;
  gap:7px;
  align-items:center;
  justify-content:flex-end;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:13px;
}

.card{
  background:rgba(23,55,43,.95);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 18px 60px rgba(0,0,0,.18);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.matchdayGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

@media(max-width:850px){
  .grid3{grid-template-columns:1fr 1fr}
  .matchdayGrid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:700px){
  .grid2,.grid3{grid-template-columns:1fr}
  .matchdayGrid{grid-template-columns:repeat(2,1fr)}
  header{align-items:flex-start}
}

h1,h2,h3,p{margin-top:0}

.muted{color:var(--muted)}
.success{color:var(--accent)}
.error{color:var(--danger)}

input,
select,
textarea{
  width:100%;
  background:var(--dark);
  color:var(--cream);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:74px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--accent);
}

button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  background:var(--cream);
  color:#102018;
  font-weight:800;
}

button.primary{background:var(--accent)}

button.ghost{
  background:transparent;
  color:var(--cream);
  border:1px solid var(--line);
}

button.danger{
  background:transparent;
  color:var(--danger);
  border:1px solid rgba(255,129,111,.4);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.stack{
  display:grid;
  gap:10px;
}

.thesis{
  background:#0d2119;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
}

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:100px;
  background:#0c2119;
  border:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  margin:2px;
}

.lobbyCard{
  display:flex;
  flex-direction:column;
  min-height:220px;
}

.lobbyCard .actions{
  margin-top:auto;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px;
}

.templateDay{
  background:#0d2119;
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
  cursor:pointer;
}

.templateDay:hover{
  border-color:var(--accent);
}

.templateDay.active{
  border-color:var(--accent);
  background:#183b2d;
}

.templateDay.complete .templateCount{
  color:var(--accent);
}

.templateNumber{
  font-weight:900;
  font-size:17px;
}

.templateCount{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.editorRow{
  display:grid;
  grid-template-columns:42px 1fr;
  gap:9px;
  align-items:start;
}

.editorNumber{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0c2119;
  border:1px solid var(--line);
  font-weight:900;
}

.turn{
  background:var(--accent);
  color:#102018;
  border-radius:14px;
  padding:13px;
  font-weight:900;
  text-align:center;
  margin-bottom:12px;
}

.phasebar{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:14px;
}

.phasebar span{
  white-space:nowrap;
  padding:7px 10px;
  border-radius:99px;
  background:#0b1d16;
  color:#7d9488;
  font-size:12px;
}

.phasebar span.active{
  background:var(--accent);
  color:#102018;
  font-weight:800;
}

.fields{
  display:grid;
  gap:8px;
}

.field{
  display:grid;
  grid-template-columns:70px 1fr;
  gap:10px;
  align-items:center;
  background:#0c2119;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
}

.fieldLabel{
  font-size:22px;
  font-weight:900;
  text-align:center;
}

.fieldButtons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.fieldButton{
  background:transparent;
  color:var(--cream);
  border:1px solid var(--line);
}

.score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  text-align:center;
}

.points{
  font-size:clamp(34px,8vw,64px);
  font-weight:900;
}

.vs{
  color:var(--muted);
  font-size:24px;
  font-weight:900;
}

.bigResult{
  text-align:center;
  font-size:clamp(32px,8vw,70px);
  font-weight:900;
}

hr{
  border:0;
  border-top:1px solid var(--line);
  margin:18px 0;
}

.footer{
  margin-top:40px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

#toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  padding:10px 16px;
  background:var(--cream);
  color:#102018;
  border-radius:100px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
}

#toast.show{opacity:1}

</style>
</head>


<body>

<div class="shell">

<header>

  <div class="brand">
    RASEN<span>SCHACH</span>
  </div>

  <div
    id="headerActions"
    class="headerActions"
  ></div>

</header>


<main id="app">
  Lade …
</main>


<div class="footer">
  Rasenschach Bundesliga · Fan-Projekt
</div>

</div>

<div id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://myqerixfnmjgvgwculiw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dr_f5ic0-aiiY3wSkX_Rng_1Ye3Vy73";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   STATE
========================================================= */

let state = {

  user:null,

  myLobbies:[],
  myLobbyPlayers:[],

  lobbyId:null,
  lobby:null,
  lobbyPlayers:[],
  matchdayGames:[],

  gameId:null,
  game:null,
  players:[],
  theses:[],
  placements:[],
  figures:[],
  me:null,

  globalTheses:[],
  selectedTemplateMatchday:1,

  channel:null

};


/* =========================================================
   CONSTANTS
========================================================= */

const fieldNames = {
  P1:"+1",
  N1:"−1",
  P3:"±3",
  N3:"∓3",
  Q:"?"
};

const figureSequence =
  [1,2,2,1,1,2,2,1,1,2];

const figureNames = {
  KING:"♔ König",
  QUEEN:"♕ Dame",
  ROOK:"♖ Turm",
  BISHOP:"♗ Läufer",
  KNIGHT:"♘ Springer"
};

const phases = [
  ["lobby","Vorbereitung"],
  ["thesis_draft","Thesendraft"],
  ["figure_draft","Figurendraft"],
  ["scoring","Auswertung"],
  ["finished","Ergebnis"]
];

const statusNames = {
  lobby:"Vorbereitung",
  thesis_draft:"Thesendraft",
  figure_draft:"Figurendraft",
  scoring:"Auswertung",
  finished:"Beendet"
};


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");

}

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(
    () => el.classList.remove("show"),
    2200
  );

}

function errorMessage(error){

  console.error(error);

  toast(
    error?.message ||
    "Etwas ist schiefgelaufen"
  );

}

function appBase(){

  return (
    location.origin +
    location.pathname
  );

}

function goHome(){

  location.href =
    appBase();

}

function openLobby(id){

  location.href =
    appBase() +
    "?lobby=" +
    encodeURIComponent(id);

}

function openGame(id){

  location.href =
    appBase() +
    "?game=" +
    encodeURIComponent(id);

}

function openThesisOverview(){

  location.href =
    appBase() +
    "?theses=1";

}

function inviteUrl(code){

  return (
    appBase() +
    "?room=" +
    encodeURIComponent(code)
  );

}

function isMainAccount(){

  return Boolean(
    state.user?.email
  );

}

function accountName(){

  return (

    state.user
      ?.user_metadata
      ?.display_name

    ||

    state.user
      ?.email
      ?.split("@")[0]

    ||

    ""

  );

}

async function copyLobbyInvite(code){

  await navigator.clipboard
    .writeText(
      inviteUrl(code)
    );

  toast(
    "Einladungslink kopiert"
  );

}

function draftedTheses(){

  return state.theses.filter(
    thesis =>
      thesis.drafted_by
  );

}

function currentThesisSeat(){

  const count =
    draftedTheses().length;

  const starter =
    state.game
      ?.thesis_start_seat || 1;

  const sequence =

    starter === 1

      ? [1,2,2,1,1,2,2,1,1,2]

      : [2,1,1,2,2,1,1,2,2,1];

  return (
    sequence[count]
    ??
    null
  );

}

function currentFigureSeat(){

  return (
    figureSequence[
      state.figures.length
    ]
    ??
    null
  );

}

function phaseBar(){

  return `

    <div class="phasebar">

      ${phases.map(
        ([id,label]) => `

          <span
            class="${
              state.game?.status === id
                ? "active"
                : ""
            }"
          >
            ${label}
          </span>

        `
      ).join("")}

    </div>

  `;

}


/* =========================================================
   AUTH
========================================================= */

async function removeAnonymousSession(){

  if(
    state.user &&
    !state.user.email
  ){

    await db.auth.signOut({
      scope:"local"
    });

    state.user = null;

  }

}

async function loginMainPlayer(){

  try{

    const email =
      document
        .getElementById("authEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("authPassword")
        .value;

    await removeAnonymousSession();

    const {
      data,
      error
    } =
      await db.auth
        .signInWithPassword({
          email,
          password
        });

    if(error){
      throw error;
    }

    state.user =
      data.user;

    goHome();

  }

  catch(error){
    errorMessage(error);
  }

}

async function registerMainPlayer(){

  try{

    const name =
      document
        .getElementById("authName")
        .value
        .trim();

    const email =
      document
        .getElementById("authEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("authPassword")
        .value;

    await removeAnonymousSession();

    const {
      data,
      error
    } =
      await db.auth.signUp({

        email,
        password,

        options:{

          data:{
            display_name:name
          },

          emailRedirectTo:
            appBase()

        }

      });

    if(error){
      throw error;
    }

    if(data.session){

      state.user =
        data.session.user;

      goHome();

    }

    else{

      toast(
        "Bitte bestätige deine E-Mail"
      );

    }

  }

  catch(error){
    errorMessage(error);
  }

}

async function logoutMainPlayer(){

  await db.auth.signOut({
    scope:"local"
  });

  goHome();

}

async function ensureGuestSession(){

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();

  if(session){

    state.user =
      session.user;

    return;

  }

  const {
    data,
    error
  } =
    await db.auth
      .signInAnonymously();

  if(error){
    throw error;
  }

  state.user =
    data.session.user;

}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

  try{

    const {
      data:{
        session
      }
    } =
      await db.auth.getSession();

    state.user =
      session?.user || null;

    const params =
      new URLSearchParams(
        location.search
      );

    const thesisOverview =
      params.get("theses");

    const lobbyId =
      params.get("lobby");

    const gameId =
      params.get("game");

    const roomCode =
      params
        .get("room")
        ?.trim()
        .toUpperCase();


    if(thesisOverview){

      if(!isMainAccount()){

        renderStartPage("");

        return;

      }

      await loadThesisOverview();

      return;

    }


    if(gameId){

      if(!state.user){

        renderStartPage("");

        return;

      }

      state.gameId = gameId;

      await refreshGame();

      subscribeGame();

      return;

    }


    if(lobbyId){

      if(!state.user){

        renderStartPage("");

        return;

      }

      state.lobbyId =
        lobbyId;

      await refreshLobby();

      subscribeLobby();

      return;

    }


    if(roomCode){

      renderStartPage(
        roomCode
      );

      return;

    }


    if(isMainAccount()){

      await loadDashboard();

      return;

    }


    renderStartPage("");

  }

  catch(error){

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="card">

        <h2>Fehler</h2>

        <p class="error">
          ${esc(error.message)}
        </p>

      </div>

    `;

  }

}


/* =========================================================
   START PAGE
========================================================= */

function renderAuthCard(){

  return `

    <div class="card">

      <h2>Hauptspieler</h2>

      <div class="stack">

        <input
          id="authName"
          placeholder="Anzeigename"
        >

        <input
          id="authEmail"
          type="email"
          placeholder="E-Mail"
        >

        <input
          id="authPassword"
          type="password"
          placeholder="Passwort"
        >

        <button
          class="primary"
          onclick="loginMainPlayer()"
        >
          Einloggen
        </button>

        <button
          class="ghost"
          onclick="registerMainPlayer()"
        >
          Konto erstellen
        </button>

      </div>

    </div>

  `;

}

function renderStartPage(room=""){

  document.getElementById(
    "headerActions"
  ).innerHTML = "";

  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h1>
        Rasenschach Bundesliga
      </h1>

      <p class="muted">

        34 Bundesliga-Spieltage.
        Zentrale Thesenverwaltung.
        Mehrere Zweier-Lobbys.

      </p>

    </div>


    <div class="grid2">

      ${
        isMainAccount()

          ? `

            <div class="card">

              <h2>
                ${esc(accountName())}
              </h2>

              <p class="muted">
                ${esc(state.user.email)}
              </p>

              <button
                class="primary"
                onclick="goHome()"
              >
                Meine Lobbys
              </button>

            </div>

          `

          : renderAuthCard()
      }


      <div class="card">

        <h2>
          Lobby beitreten
        </h2>

        <div class="stack">

          <input
            id="joinName"
            placeholder="Dein Name"
          >

          <input
            id="joinCode"
            maxlength="6"
            placeholder="Lobby-Code"
            value="${esc(room)}"
          >

          <button
            onclick="joinLobby()"
          >
            Beitreten
          </button>

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   THESEN ÜBERSICHT
========================================================= */

async function loadThesisOverview(){

  const {
    data,
    error
  } =
    await db
      .from("global_theses")
      .select("*")
      .eq(
        "owner_id",
        state.user.id
      )
      .order("matchday")
      .order("slot");

  if(error){
    throw error;
  }

  state.globalTheses =
    data || [];

  renderThesisOverview();

}

function templateCount(matchday){

  return state.globalTheses.filter(
    thesis =>
      thesis.matchday ===
      matchday
      &&
      thesis.text?.trim()
  ).length;

}

function templateText(
  matchday,
  slot
){

  return (
    state.globalTheses.find(
      thesis =>
        thesis.matchday === matchday
        &&
        thesis.slot === slot
    )?.text
    ||
    ""
  );

}

function selectTemplateMatchday(matchday){

  state.selectedTemplateMatchday =
    matchday;

  renderThesisOverview();

}

function renderThesisOverview(){

  const selected =
    state.selectedTemplateMatchday;

  document.getElementById(
    "headerActions"
  ).innerHTML = `

    <button
      class="ghost"
      onclick="goHome()"
    >
      ← Meine Lobbys
    </button>

  `;


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <span class="badge">
        Zentrale Verwaltung
      </span>

      <h1 style="margin-top:12px">
        Thesen Übersicht
      </h1>

      <p class="muted">

        Diese Thesen gelten automatisch
        für alle deine Lobbys.

        Jeder Bundesliga-Spieltag besitzt
        einen eigenen Satz aus zwölf Thesen.

      </p>

    </div>


    <div class="card">

      <h2>
        Spieltag auswählen
      </h2>

      <div class="matchdayGrid">

        ${Array.from(
          {length:34},
          (_,i) => {

            const matchday =
              i + 1;

            const count =
              templateCount(matchday);

            return `

              <div
                class="
                  templateDay
                  ${
                    selected === matchday
                      ? "active"
                      : ""
                  }
                  ${
                    count === 12
                      ? "complete"
                      : ""
                  }
                "

                onclick="
                  selectTemplateMatchday(
                    ${matchday}
                  )
                "
              >

                <div class="templateNumber">
                  ST ${matchday}
                </div>

                <div class="templateCount">
                  ${count}/12 Thesen
                </div>

              </div>

            `;

          }
        ).join("")}

      </div>

    </div>


    <div class="card">

      <h2>
        Bundesliga-Spieltag
        ${selected}
      </h2>

      <p class="muted">

        Änderungen werden beim Speichern
        in alle noch nicht gestarteten
        Spiele dieses Spieltags synchronisiert.

      </p>


      <div class="stack">

        ${Array.from(
          {length:12},
          (_,i) => {

            const slot =
              i + 1;

            return `

              <div class="editorRow">

                <div class="editorNumber">
                  ${slot}
                </div>

                <textarea
                  id="globalThesis${slot}"
                  placeholder="These ${slot}"
                >${esc(
                  templateText(
                    selected,
                    slot
                  )
                )}</textarea>

              </div>

            `;

          }
        ).join("")}

      </div>


      <div class="actions">

        <button
          class="primary"
          onclick="saveGlobalTheses()"
        >
          Thesen speichern & synchronisieren
        </button>

      </div>

    </div>

  `;

}

async function saveGlobalTheses(){

  try{

    const texts =
      Array.from(
        {length:12},
        (_,i) =>
          document
            .getElementById(
              `globalThesis${i+1}`
            )
            .value
            .trim()
      );


    const {
      error
    } =
      await db.rpc(
        "save_global_theses",
        {

          p_matchday:
            state.selectedTemplateMatchday,

          p_theses:
            texts

        }
      );


    if(error){
      throw error;
    }


    toast(
      "Thesen gespeichert und synchronisiert"
    );


    await loadThesisOverview();

  }

  catch(error){
    errorMessage(error);
  }

}


/* =========================================================
   DASHBOARD
========================================================= */

async function loadDashboard(){

  const membership =
    await db
      .from("lobby_players")
      .select("*")
      .eq(
        "user_id",
        state.user.id
      );

  if(membership.error){
    throw membership.error;
  }

  const memberships =
    membership.data || [];

  if(!memberships.length){

    state.myLobbies = [];
    state.myLobbyPlayers = [];

    renderDashboard();

    return;

  }

  const ids =
    [
      ...new Set(
        memberships.map(
          item =>
            item.lobby_id
        )
      )
    ];


  const [
    lobbyResult,
    playerResult
  ] =
    await Promise.all([

      db
        .from("lobbies")
        .select("*")
        .in("id",ids)
        .order(
          "created_at",
          {ascending:false}
        ),

      db
        .from("lobby_players")
        .select("*")
        .in("lobby_id",ids)
        .order("seat")

    ]);


  if(lobbyResult.error){
    throw lobbyResult.error;
  }

  if(playerResult.error){
    throw playerResult.error;
  }


  state.myLobbies =
    lobbyResult.data || [];

  state.myLobbyPlayers =
    playerResult.data || [];

  renderDashboard();

}

/* =========================================================

========================================================= */

let refreshTimer;

function subscribeGame(){

  if(state.channel){
    db.removeChannel(
      state.channel
    );
  }


  const channel =
    db.channel(
      `game-${state.gameId}`
    );


  [
    "games",
    "players",
    "theses",
    "placements",
    "figure_picks"
  ].forEach(
    table => {

      channel.on(

        "postgres_changes",

        {
          event:"*",
          schema:"public",
          table,

          filter:
            table === "games"

              ? `id=eq.${state.gameId}`

              : `game_id=eq.${state.gameId}`
        },

        () => {

          clearTimeout(
            refreshTimer
          );

          refreshTimer =
            setTimeout(
              refreshGame,
              120
            );

        }

      );

    }
  );


  channel.subscribe();

  state.channel =
    channel;

}

function subscribeLobby(){

  if(state.channel){
    db.removeChannel(
      state.channel
    );
  }


  const channel =
    db.channel(
      `lobby-${state.lobbyId}`
    );


  channel.on(

    "postgres_changes",

    {
      event:"*",
      schema:"public",
      table:"games",
      filter:
        `lobby_id=eq.${state.lobbyId}`
    },

    refreshLobby

  );


  channel.subscribe();

  state.channel =
    channel;

}

){

  if(
    thesis?.resolved === null
    ||
    thesis?.resolved === undefined
  ){
    return 0;
  }


  switch(placement.field){

    case "P1":
      return thesis.resolved ? 1 : 0;

    case "N1":
      return thesis.resolved ? 0 : 1;

    case "P3":
      return thesis.resolved ? 3 : -3;

    case "N3":
      return thesis.resolved ? -3 : 3;

    case "Q":
      return thesis.resolved
        ? state.game.random_value
        : -state.game.random_value;

  }

  return 0;

}

function playerScore(userId){

  let thesisTotal = 0;
  let figureTotal = 0;


  state.placements
    .filter(
      item =>
        item.user_id ===
        userId
    )
    .forEach(
      placement => {

        const thesis =
          state.theses.find(
            item =>
              item.id ===
              placement.thesis_id
          );

        thesisTotal +=
          thesisPoints(
            placement,
            thesis
          );

      }
    );


  state.figures
    .filter(
      item =>
        item.user_id ===
        userId
    )
    .forEach(
      figure => {

        figureTotal +=
          Number(
            figure.points || 0
          );

      }
    );


  return {
    total:
      thesisTotal +
      figureTotal
  };

}

function renderScoring(finished){

  const p1 =
    state.players[0];

  const p2 =
    state.players[1];

  const s1 =
    playerScore(
      p1.user_id
    );

  const s2 =
    playerScore(
      p2.user_id
    );


  return `

    <div class="card score">

      <div>

        <strong>
          ${esc(p1.name)}
        </strong>

        <div class="points">
          ${s1.total}
        </div>

      </div>

      <div class="vs">:</div>

      <div>

        <strong>
          ${esc(p2.name)}
        </strong>

        <div class="points">
          ${s2.total}
        </div>

      </div>

    </div>


    <div class="grid2">

      ${state.players.map(
        player => `

          <div class="card">

            <h2>
              ${esc(player.name)}
            </h2>


            ${state.placements

              .filter(
                item =>
                  item.user_id ===
                  player.user_id
              )

              .map(
                placement => {

                  const thesis =
                    state.theses.find(
                      item =>
                        item.id ===
                        placement.thesis_id
                    );


                  return `

                    <div class="thesis">

                      <strong>
                        ${fieldNames[
                          placement.field
                        ]}
                      </strong>

                      <p>
                        ${esc(thesis.text)}
                      </p>

                      ${
                        !finished

                          ? `

                            <div class="row">

                              <button
                                onclick="
                                  resolveThesis(
                                    '${thesis.id}',
                                    true
                                  )
                                "
                              >
                                Eingetreten
                              </button>

                              <button
                                class="ghost"
                                onclick="
                                  resolveThesis(
                                    '${thesis.id}',
                                    false
                                  )
                                "
                              >
                                Nicht eingetreten
                              </button>

                            </div>

                          `

                          : ""
                      }

                    </div>

                  `;

                }
              ).join("")}


            <hr>


            ${state.figures

              .filter(
                item =>
                  item.user_id ===
                  player.user_id
              )

              .map(
                figure => `

                  <div class="thesis">

                    <strong>

                      ${figureNames[
                        figure.figure
                      ]}

                      ·

                      ${esc(
                        figure.footballer
                      )}

                    </strong>


                    ${
                      !finished

                        ? `

                          <div class="row">

                            <button
                              onclick="
                                setFigurePoints(
                                  '${figure.id}',
                                  ${
                                    Number(
                                      figure.points
                                    ) - 1
                                  }
                                )
                              "
                            >
                              −
                            </button>

                            <strong>
                              ${figure.points}
                            </strong>

                            <button
                              onclick="
                                setFigurePoints(
                                  '${figure.id}',
                                  ${
                                    Number(
                                      figure.points
                                    ) + 1
                                  }
                                )
                              "
                            >
                              +
                            </button>

                          </div>

                        `

                        : ""
                    }

                  </div>

                `
              ).join("")}

          </div>

        `
      ).join("")}

    </div>


    ${
      !finished

        ? `

          <div class="card">

            <button
              class="primary"
              onclick="finishGame()"
            >
              Abpfiff
            </button>

          </div>

        `

        : ""
    }

  `;

}

async function resolveThesis(
  id,
  value
){

  const {
    error
  } =
    await db.rpc(
      "resolve_thesis",
      {
        p_thesis_id:id,
        p_resolved:value
      }
    );

  if(error){
    errorMessage(error);
  }

}

async function setFigurePoints(
  id,
  points
){

  const {
    error
  } =
    await db.rpc(
      "set_figure_points",
      {
        p_pick_id:id,
        p_points:points
      }
    );

  if(error){
    errorMessage(error);
  }

}

async function finishGame(){

  const {
    error
  } =
    await db.rpc(
      "finish_game",
      {
        p_game_id:
          state.gameId
      }
    );

  if(error){
    errorMessage(error);
  }

}


/* =========================================================
   START
========================================================= */

boot();

</script>

</body>
</html>
