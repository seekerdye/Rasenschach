<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Rasenschach – Thesen, Draft und Fußball für zwei Spieler."
  >

  <title>Rasenschach Duo</title>

  <!-- Supabase JavaScript Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {
      --bg: #10281f;
      --panel: #17372b;
      --panel-light: #1e4435;
      --cream: #f3eedf;
      --muted: #b7c6bd;
      --line: #315747;
      --accent: #d8ff69;
      --danger: #ff816f;
      --dark: #0a1712;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;

      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #24503f 0,
          #10281f 45%,
          #09140f 100%
        );

      color: var(--cream);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      width: min(
        1100px,
        calc(100% - 24px)
      );

      margin: auto;

      padding:
        20px
        0
        60px;
    }

    header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 12px;

      margin-bottom: 18px;
    }

    .brand {
      font-weight: 900;

      letter-spacing: -0.04em;

      font-size:
        clamp(
          24px,
          5vw,
          42px
        );
    }

    .brand span {
      color: var(--accent);
    }

    .room {
      color: var(--muted);

      font-size: 13px;

      display: flex;

      align-items: center;
      justify-content: flex-end;

      gap: 6px;

      flex-wrap: wrap;
    }

    .card {
      background:
        rgba(
          23,
          55,
          43,
          0.94
        );

      border:
        1px
        solid
        var(--line);

      border-radius: 20px;

      padding: 18px;

      margin: 12px 0;

      box-shadow:
        0
        18px
        60px
        rgba(0, 0, 0, 0.18);
    }

    .grid2 {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    @media (max-width: 720px) {

      .grid2 {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
      }

      .room {
        justify-content: flex-end;
      }

    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      letter-spacing: -0.03em;
    }

    h2 {
      font-size: 20px;
    }

    .muted {
      color: var(--muted);
    }

    input,
    select {

      width: 100%;

      background: var(--dark);

      color: var(--cream);

      border:
        1px
        solid
        var(--line);

      border-radius: 12px;

      padding: 12px;

      outline: none;
    }

    input:focus,
    select:focus {

      border-color: var(--accent);
    }

    button {

      border: 0;

      border-radius: 12px;

      padding:
        11px
        14px;

      background: var(--cream);

      color: #102018;

      font-weight: 800;
    }

    button.primary {

      background: var(--accent);
    }

    button.ghost {

      background: transparent;

      color: var(--cream);

      border:
        1px
        solid
        var(--line);
    }

    button.danger {

      background: transparent;

      color: var(--danger);

      border:
        1px
        solid
        rgba(
          255,
          129,
          111,
          0.35
        );
    }

    button:disabled {

      opacity: 0.45;

      cursor: not-allowed;
    }

    .row {

      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }

    .stack {

      display: grid;

      gap: 10px;
    }

    .thesis {

      background: #0d2119;

      border:
        1px
        solid
        var(--line);

      border-radius: 14px;

      padding: 13px;
    }

    .thesis.available:hover {

      border-color: var(--accent);
    }

    .badge {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding:
        5px
        9px;

      border-radius: 100px;

      background: #0c2119;

      border:
        1px
        solid
        var(--line);

      color: var(--muted);

      font-size: 12px;

      margin:
        2px
        2px
        2px
        0;
    }

    .badge.live {

      color: var(--accent);
    }

    .score {

      display: grid;

      grid-template-columns:
        1fr auto 1fr;

      gap: 14px;

      align-items: center;

      text-align: center;
    }

    .score .points {

      font-size:
        clamp(
          34px,
          8vw,
          64px
        );

      font-weight: 900;
    }

    .vs {

      color: var(--muted);

      font-weight: 900;

      font-size: 24px;
    }

    .fields {

      display: grid;

      gap: 8px;
    }

    .field {

      display: grid;

      grid-template-columns:
        70px 1fr;

      align-items: center;

      gap: 10px;

      background: #0c2119;

      padding: 10px;

      border-radius: 14px;

      border:
        1px
        solid
        var(--line);
    }

    .fieldLabel {

      font-size: 22px;

      font-weight: 900;

      text-align: center;
    }

    .phasebar {

      display: flex;

      overflow-x: auto;

      gap: 6px;

      margin-bottom: 14px;

      scrollbar-width: none;
    }

    .phasebar::-webkit-scrollbar {

      display: none;
    }

    .phasebar span {

      white-space: nowrap;

      padding:
        7px
        10px;

      border-radius: 99px;

      background: #0b1d16;

      color: #7d9488;

      font-size: 12px;
    }

    .phasebar span.active {

      color: #102018;

      background: var(--accent);

      font-weight: 800;
    }

    .playerBoard {

      min-height: 120px;
    }

    .turn {

      background: var(--accent);

      color: #102018;

      font-weight: 900;

      padding: 12px;

      border-radius: 14px;

      text-align: center;

      margin-bottom: 12px;
    }

    .success {

      color: var(--accent);
    }

    .error {

      color: var(--danger);
    }

    .bigResult {

      text-align: center;

      font-size:
        clamp(
          32px,
          8vw,
          72px
        );

      font-weight: 900;
    }

    .hidden {

      display: none !important;
    }

    #toast {

      position: fixed;

      bottom: 20px;
      left: 50%;

      transform:
        translateX(-50%);

      padding:
        10px
        16px;

      border-radius: 100px;

      background: #f5f0e2;

      color: #102018;

      font-weight: 800;

      opacity: 0;

      pointer-events: none;

      transition: 0.2s;

      z-index: 1000;

      max-width:
        calc(100% - 30px);

      text-align: center;
    }

    #toast.show {

      opacity: 1;
    }

    small {

      color: var(--muted);
    }

    hr {

      border: 0;

      border-top:
        1px
        solid
        var(--line);

      margin:
        18px
        0;
    }

    .footer {

      margin-top: 40px;

      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }

    .loading {

      text-align: center;

      padding: 60px 20px;

      color: var(--muted);
    }

  </style>

</head>

<body>

  <div class="shell">

    <header>

      <div class="brand">
        RASEN<span>SCHACH</span>
      </div>

      <div
        id="roomHeader"
        class="room"
      ></div>

    </header>

    <main id="app">

      <div class="loading">
        Rasenschach wird geladen …
      </div>

    </main>

    <div class="footer">
      Rasenschach Duo · Fan-Projekt
    </div>

  </div>

  <div id="toast"></div>

<script>

/* =========================================================
   1. SUPABASE EINSTELLUNGEN

   HIER MUSST DU NUR DEINE BEIDEN WERTE EINTRAGEN.
========================================================= */

const SUPABASE_URL =
  "https://myqerixfnmjgvgwculiw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dr_f5ic0-aiiY3wSkX_Rng_1Ye3Vy73";


/* =========================================================
   2. SUPABASE CLIENT
========================================================= */

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   3. APP STATE
========================================================= */

let state = {

  user: null,

  gameId: null,

  game: null,

  players: [],

  theses: [],

  placements: [],

  figures: [],

  me: null,

  channel: null

};


/* =========================================================
   4. SPIELREGELN
========================================================= */

const thesisSequence =
  [
    1,
    2,
    2,
    1,
    1,
    2,
    2,
    1,
    1,
    2
  ];


const figureSequence =
  [
    1,
    2,
    2,
    1,
    1,
    2,
    2,
    1,
    1,
    2
  ];


const figureNames = {

  KING:
    "♔ König",

  QUEEN:
    "♕ Dame",

  ROOK:
    "♖ Turm",

  BISHOP:
    "♗ Läufer",

  KNIGHT:
    "♘ Springer"

};


const fieldNames = {

  P1:
    "+1",

  N1:
    "−1",

  P3:
    "±3",

  N3:
    "∓3",

  Q:
    "?"

};


const phases = [

  [
    "lobby",
    "Vorbereitung"
  ],

  [
    "thesis_draft",
    "Thesendraft"
  ],

  [
    "thesis_placement",
    "Setzen"
  ],

  [
    "figure_draft",
    "Figurendraft"
  ],

  [
    "scoring",
    "Auswertung"
  ],

  [
    "finished",
    "Ergebnis"
  ]

];


/* =========================================================
   5. HILFSFUNKTIONEN
========================================================= */

function esc(value) {

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  );

}


function toast(message) {

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

  setTimeout(
    () => {

      element
        .classList
        .remove(
          "show"
        );

    },
    2200
  );

}


function errorMessage(error) {

  console.error(
    error
  );

  toast(
    error?.message ||
    "Etwas ist schiefgelaufen"
  );

}


function playerByUser(
  userId
) {

  return state.players.find(
    player =>
      player.user_id ===
      userId
  );

}


function draftedTheses() {

  return state.theses.filter(
    thesis =>
      thesis.drafted_by
  );

}


function currentThesisSeat() {

  const count =
    draftedTheses()
      .length;

  return (
    thesisSequence[count] ??
    null
  );

}


function currentFigureSeat() {

  const count =
    state.figures.length;

  return (
    figureSequence[count] ??
    null
  );

}


function phaseBar() {

  return `

    <div class="phasebar">

      ${phases.map(
        ([id, label]) => `

          <span
            class="${
              state.game?.status === id
                ? "active"
                : ""
            }"
          >
            ${label}
          </span>

        `
      ).join("")}

    </div>

  `;

}


function shareUrl() {

  return (
    location.origin +
    location.pathname +
    "?room=" +
    state.game.code
  );

}


async function copyInvite() {

  try {

    await navigator.clipboard
      .writeText(
        shareUrl()
      );

    toast(
      "Einladungslink kopiert"
    );

  }

  catch {

    toast(
      "Link konnte nicht kopiert werden"
    );

  }

}


function resetLocalGame() {

  const confirmed =
    confirm(
      "Zur Startseite zurückkehren? Das Spiel bleibt in der Datenbank gespeichert."
    );

  if (!confirmed) {

    return;

  }

  localStorage.removeItem(
    "rasenschach_game"
  );

  location.href =
    location.pathname;

}


function thesisPoints(
  placement,
  thesis
) {

  if (
    thesis?.resolved === null ||
    thesis?.resolved === undefined
  ) {

    return 0;

  }

  const correct =
    thesis.resolved;

  switch (
    placement.field
  ) {

    case "P1":

      return correct
        ? 1
        : 0;


    case "N1":

      return correct
        ? 0
        : 1;


    case "P3":

      return correct
        ? 3
        : -3;


    case "N3":

      return correct
        ? -3
        : 3;


    case "Q":

      return correct

        ? state.game.random_value

        : -state.game.random_value;

  }

  return 0;

}


function playerScore(
  userId
) {

  let thesisPointsTotal =
    0;

  let figurePointsTotal =
    0;


  state.placements

    .filter(
      placement =>
        placement.user_id ===
        userId
    )

    .forEach(
      placement => {

        const thesis =
          state.theses.find(
            item =>
              item.id ===
              placement.thesis_id
          );

        thesisPointsTotal +=
          thesisPoints(
            placement,
            thesis
          );

      }
    );


  state.figures

    .filter(
      figure =>
        figure.user_id ===
        userId
    )

    .forEach(
      figure => {

        figurePointsTotal +=
          Number(
            figure.points ||
            0
          );

      }
    );


  return {

    thesis:
      thesisPointsTotal,

    figures:
      figurePointsTotal,

    total:
      thesisPointsTotal +
      figurePointsTotal

  };

}


/* =========================================================
   6. START / AUTHENTIFIZIERUNG
========================================================= */

async function boot() {

  try {

    if (
      SUPABASE_URL.includes(
        "HIER_"
      ) ||
      SUPABASE_KEY.includes(
        "HIER_"
      )
    ) {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="card">

          <h2>
            Supabase noch nicht verbunden
          </h2>

          <p>
            Öffne die Datei
            <strong>index.html</strong>
            und trage oben im JavaScript-Bereich
            deine Supabase Project URL
            und deinen Publishable Key ein.
          </p>

        </div>

      `;

      return;

    }


    const {
      data: {
        session
      }
    } =
      await db.auth
        .getSession();


    let activeSession =
      session;


    if (
      !activeSession
    ) {

      const {
        data,
        error
      } =
        await db.auth
          .signInAnonymously();


      if (
        error
      ) {

        throw error;

      }


      activeSession =
        data.session;

    }


    state.user =
      activeSession.user;


    const storedGame =
      localStorage.getItem(
        "rasenschach_game"
      );


    const incomingRoom =
      new URLSearchParams(
        location.search
      )
      .get(
        "room"
      )
      ?.trim()
      .toUpperCase();


    if (
      storedGame
    ) {

      state.gameId =
        storedGame;

      try {

        await refresh();


        /*
          Wenn über einen Einladungslink
          ein anderer Raum geöffnet wurde,
          zeigen wir stattdessen die
          Beitrittsseite.
        */

        if (
          incomingRoom &&
          state.game?.code !==
          incomingRoom
        ) {

          localStorage
            .removeItem(
              "rasenschach_game"
            );

          state.gameId =
            null;

          state.game =
            null;

          renderLanding();

          return;

        }


        subscribe();

        return;

      }

      catch (
        error
      ) {

        console.warn(
          "Gespeichertes Spiel konnte nicht geladen werden.",
          error
        );

        localStorage
          .removeItem(
            "rasenschach_game"
          );

        state.gameId =
          null;

      }

    }


    renderLanding();

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="card">

        <h2>
          Supabase-Verbindung fehlgeschlagen
        </h2>

        <p class="error">
          ${esc(
            error.message
          )}
        </p>

        <p>
          Prüfe:
        </p>

        <ul>

          <li>
            Project URL
          </li>

          <li>
            Publishable Key
          </li>

          <li>
            Anonymous Sign-Ins
          </li>

          <li>
            ob der SQL-Code erfolgreich
            ausgeführt wurde
          </li>

        </ul>

      </div>

    `;

  }

}


/* =========================================================
   7. STARTSEITE
========================================================= */

function renderLanding() {

  const incomingRoom =
    new URLSearchParams(
      location.search
    )
    .get(
      "room"
    ) || "";


  document.getElementById(
    "roomHeader"
  ).innerHTML =
    "";


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="card">

      <h1>
        Rasenschach für zwei.
      </h1>

      <p class="muted">
        Thesen draften.
        Bretter verdeckt setzen.
        Fußballer auswählen.
        Spieltag gewinnen.
      </p>

    </div>


    <div class="grid2">


      <div class="card">

        <h2>
          Neues Duell
        </h2>


        <div class="stack">

          <input
            id="createName"
            maxlength="30"
            autocomplete="name"
            placeholder="Dein Name"
          >


          <button
            class="primary"
            onclick="createGame()"
          >
            Raum erstellen
          </button>

        </div>

      </div>


      <div class="card">

        <h2>
          Raum beitreten
        </h2>


        <div class="stack">

          <input
            id="joinName"
            maxlength="30"
            autocomplete="name"
            placeholder="Dein Name"
          >


          <input
            id="joinCode"
            maxlength="6"
            placeholder="Raumcode"
            value="${esc(
              incomingRoom
            )}"
          >


          <button
            onclick="joinGame()"
          >
            Beitreten
          </button>

        </div>

      </div>


    </div>

  `;

}


/* =========================================================
   8. SPIEL ERSTELLEN
========================================================= */

async function createGame() {

  try {

    const name =
      document.getElementById(
        "createName"
      )
      .value
      .trim();


    if (
      !name
    ) {

      toast(
        "Bitte Namen eingeben"
      );

      return;

    }


    const {
      data,
      error
    } =
      await db.rpc(
        "create_game",
        {
          p_name:
            name
        }
      );


    if (
      error
    ) {

      throw error;

    }


    state.gameId =
      data[0].game_id;


    localStorage
      .setItem(
        "rasenschach_game",
        state.gameId
      );


    await refresh();


    subscribe();

  }

  catch (
    error
  ) {

    errorMessage(
      error
    );

  }

}


/* =========================================================
   9. SPIEL BEITRETEN
========================================================= */

async function joinGame() {

  try {

    const name =
      document.getElementById(
        "joinName"
      )
      .value
      .trim();


    const code =
      document.getElementById(
        "joinCode"
      )
      .value
      .trim()
      .toUpperCase();


    if (
      !name ||
      !code
    ) {

      toast(
        "Name und Raumcode eingeben"
      );

      return;

    }


    const {
      data,
      error
    } =
      await db.rpc(
        "join_game",
        {

          p_code:
            code,

          p_name:
            name

        }
      );


    if (
      error
    ) {

      throw error;

    }


    state.gameId =
      data[0].game_id;


    localStorage
      .setItem(
        "rasenschach_game",
        state.gameId
      );


    await refresh();


    subscribe();

  }

  catch (
    error
  ) {

    errorMessage(
      error
    );

  }

}


/* =========================================================
   10. DATEN LADEN
========================================================= */

async function refresh() {

  if (
    !state.gameId
  ) {

    return;

  }


  const [

    gameResult,

    playerResult,

    thesisResult,

    placementResult,

    figureResult

  ] = await Promise.all([


    db
      .from(
        "games"
      )
      .select(
        "*"
      )
      .eq(
        "id",
        state.gameId
      )
      .single(),


    db
      .from(
        "players"
      )
      .select(
        "*"
      )
      .eq(
        "game_id",
        state.gameId
      )
      .order(
        "seat"
      ),


    db
      .from(
        "theses"
      )
      .select(
        "*"
      )
      .eq(
        "game_id",
        state.gameId
      )
      .order(
        "created_at"
      ),


    db
      .from(
        "placements"
      )
      .select(
        "*"
      )
      .eq(
        "game_id",
        state.gameId
      ),


    db
      .from(
        "figure_picks"
      )
      .select(
        "*"
      )
      .eq(
        "game_id",
        state.gameId
      )
      .order(
        "draft_order"
      )

  ]);


  if (
    gameResult.error
  ) {

    throw gameResult.error;

  }


  if (
    playerResult.error
  ) {

    throw playerResult.error;

  }


  if (
    thesisResult.error
  ) {

    throw thesisResult.error;

  }


  if (
    placementResult.error
  ) {

    throw placementResult.error;

  }


  if (
    figureResult.error
  ) {

    throw figureResult.error;

  }


  state.game =
    gameResult.data;


  state.players =
    playerResult.data ||
    [];


  state.theses =
    thesisResult.data ||
    [];


  state.placements =
    placementResult.data ||
    [];


  state.figures =
    figureResult.data ||
    [];


  state.me =
    state.players.find(
      player =>
        player.user_id ===
        state.user.id
    );


  render();

}


/* =========================================================
   11. REALTIME SYNCHRONISIERUNG
========================================================= */

let refreshTimer;


function scheduleRefresh() {

  clearTimeout(
    refreshTimer
  );


  refreshTimer =
    setTimeout(
      () => {

        refresh()
          .catch(
            errorMessage
          );

      },
      120
    );

}


function subscribe() {

  if (
    state.channel
  ) {

    db.removeChannel(
      state.channel
    );

  }


  const channel =
    db.channel(
      `rasenschach-${state.gameId}`
    );


  [
    "games",
    "players",
    "theses",
    "placements",
    "figure_picks"
  ]

  .forEach(
    table => {

      channel.on(

        "postgres_changes",

        {

          event:
            "*",

          schema:
            "public",

          table,

          filter:

            table ===
            "games"

              ? `id=eq.${state.gameId}`

              : `game_id=eq.${state.gameId}`

        },

        scheduleRefresh

      );

    }
  );


  channel.subscribe();


  state.channel =
    channel;

}

  let content =

  ) {

      content =

      break;


    case "thesis_draft":

      content =
        renderThesisDraft();

      break;


    case "thesis_placement":

      content =
        renderPlacement();

      break;


    case "figure_draft":

      content =

    default:

  document.getElementById(

async function addThesis() {

  const element =
    document.getElementById(
      "newThesis"
    );


  const text =
    element.value.trim();


  if (
    !text
  ) {

    return;

  }


  try {

    const {
      error
    } =
      await db
        .from(
          "theses"
        )
        .insert(
          {

            game_id:
              state.gameId,

            text

          }
        );


    if (
      error
    ) {

      throw error;

    }


    element.value =
      "";

  }

  catch (
    error
  ) {

    errorMessage(
      error
    );

  }

}

                              ? "+"
                              : ""
                          }${points}

                        </strong>


                        <div>

                          ${esc(
                            thesis.text
                          )}

                        </div>


                        ${
                          finished

                            ? `

                              <div class="muted">

                                ${
                                  thesis.resolved

                                    ? "✓ eingetreten"

                                    : "✕ nicht eingetreten"
                                }

                              </div>

                            `

                            : `

                              <div
                                class="row"
                                style="
                                  margin-top:8px
                                "
                              >


                                <button

                                  class="${
                                    thesis.resolved === true

                                      ? "primary"

                                      : "ghost"
                                  }"

                                  onclick="
                                    resolveThesis(
                                      '${thesis.id}',
                                      true
                                    )
                                  "
                                >

                                  Eingetreten

                                </button>


                                <button

                                  class="${
                                    thesis.resolved === false

                                      ? "primary"

                                      : "ghost"
                                  }"

                                  onclick="
                                    resolveThesis(
                                      '${thesis.id}',
                                      false
                                    )
                                  "
                                >

                                  Nicht eingetreten

                                </button>


                              </div>

                            `
                        }


                      </div>

                    `;

                  }
                ).join("")}


              </div>


              <hr>


              <h3>
                Figuren
              </h3>


              <div class="stack">


                ${figures.map(
                  figure => `


                    <div class="thesis">


                      <div>

                        <strong>

                          ${
                            figureNames[
                              figure.figure
                            ]
                          }

                        </strong>

                        ·

                        ${esc(
                          figure.footballer
                        )}

                      </div>


                      <div
                        class="row"
                        style="
                          margin-top:8px
                        "
                      >


                        ${
                          finished

                            ? `

                              <strong>

                                ${
                                  figure.points >= 0
                                    ? "+"
                                    : ""
                                }${figure.points}

                                Punkte

                              </strong>

                            `

                            : `


                              <button

                                class="ghost"

                                onclick="
                                  setFigurePoints(
                                    '${figure.id}',
                                    ${
                                      Number(
                                        figure.points
                                      ) - 1
                                    }
                                  )
                                "
                              >
                                −
                              </button>


                              <strong>

                                ${
                                  Number(
                                    figure.points
                                  ) >= 0

                                    ? "+"

                                    : ""
                                }

                                ${figure.points}

                              </strong>


                              <button

                                class="ghost"

                                onclick="
                                  setFigurePoints(
                                    '${figure.id}',
                                    ${
                                      Number(
                                        figure.points
                                      ) + 1
                                    }
                                  )
                                "
                              >
                                +
                              </button>


                            `
                        }


                      </div>


                    </div>


                  `
                ).join("")}


              </div>


            </div>

          `;

        }
      ).join("")}


    </div>


    ${
      !finished

        ? `

          <div class="card">


            <h2>
              Spieltag abschließen
            </h2>


            <p class="muted">

              Sobald alle zehn gedrafteten
              Thesen ausgewertet wurden,
              könnt ihr das Ergebnis sperren.

            </p>


            <button

              class="primary"

              onclick="
                finishGame()
              "

            >
              Abpfiff
            </button>


          </div>

        `

        : `

          <div class="card">

            <button
              onclick="
                resetLocalGame()
              "
            >
              Neues Spiel
            </button>

          </div>

        `
    }

  `;

}


/* =========================================================
   26. THESE AUSWERTEN
========================================================= */

async function resolveThesis(
  id,
  value
) {

  try {

    const {
      error
    } =
      await db.rpc(
        "resolve_thesis",
        {

          p_thesis_id:
            id,

          p_resolved:
            value

        }
      );


    if (
      error
    ) {

      throw error;

    }

  }

  catch (
    error
  ) {

    errorMessage(
      error
    );

  }

}


/* =========================================================
   27. FIGURENPUNKTE ÄNDERN
========================================================= */

async function setFigurePoints(
  id,
  points
) {

  try {

    const {
      error
    } =
      await db.rpc(
        "set_figure_points",
        {

          p_pick_id:
            id,

          p_points:
            points

        }
      );


    if (
      error
    ) {

      throw error;

    }

  }

  catch (
    error
  ) {

    errorMessage(
      error
    );

  }

}


/* =========================================================
   28. SPIEL ABSCHLIESSEN
========================================================= */

async function finishGame() {

  try {

    const {
      error
    } =
      await db.rpc(
        "finish_game",
        {

          p_game_id:
            state.gameId

        }
      );


    if (
      error
    ) {

      throw error;

    }

  }

  catch (
    error
  ) {

    errorMessage(
      error
    );

  }

}


/* =========================================================
   29. APP STARTEN
========================================================= */

boot();

</script>

</body>
</html>
