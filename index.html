<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"

<title>Rasenschach | by max x Calcio Berlin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#181a1d;
  --panel:#26282c;
  --dark:#111214;
  --cream:#ffffff;
  --muted:#b8bcc2;
  --line:#484c52;
  --calcio-pink:#feb8ec;
  --accent:var(--calcio-pink);
  --danger:#ff7d7d;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #393c41 0,
      #1d1f22 45%,
      #101113 100%
    );

  color:var(--cream);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  width:min(
    1150px,
    calc(100% - 24px)
  );

  margin:auto;

  padding:20px 0 60px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:12px;

  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:8px;

  font-size:
    clamp(
      25px,
      5vw,
      42px
    );

  font-weight:900;

  letter-spacing:-.04em;
}

.brand span{
  color:var(--cream);
}

.brandByline{
  font-size:clamp(11px,1.8vw,16px);
  font-weight:750;
  letter-spacing:.02em;
}

.calcio{
  color:var(--calcio-pink) !important;
}

.titleByline{
  font-size:.46em;
  font-weight:750;
  letter-spacing:.01em;
  white-space:nowrap;
}

.headerActions{
  display:flex;

  gap:7px;

  align-items:center;
  justify-content:flex-end;

  flex-wrap:wrap;

  color:var(--muted);

  font-size:13px;
}

.card{
  background:
    rgba(
      38,
      40,
      44,
      .96
    );

  border:
    1px solid
    var(--line);

  border-radius:20px;

  padding:18px;

  margin:12px 0;

  box-shadow:
    0 18px 60px
    rgba(0,0,0,.18);
}

.grid2{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;
}

.grid3{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

.figurePlayerGrid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;
}

.figurePlayerColumn{
  min-width:0;
}

.figurePlayerColumn h3{
  margin-bottom:10px;
}

.matchdayGrid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:9px;
}

.fixtureCard{
  padding:0;

  overflow:hidden;
}

.fixtureBoard{
  max-width:650px;

  margin:0 auto;

  padding:22px 20px 20px;

  background:transparent;
}

.fixtureBoardTitle{
  text-align:center;

  color:#fff;

  font-size:18px;

  font-weight:1000;

  letter-spacing:.035em;
}

.fixtureDivider{
  height:1px;

  margin:12px 0 13px;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(254,184,236,.3),
    transparent
  );
}

.fixtureSchedule{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px 14px;

  max-width:560px;

  margin:0 auto;
}

.fixtureDateRibbon{
  display:flex;

  align-items:center;

  justify-content:center;

  min-height:24px;

  padding:3px 14px;

  clip-path:polygon(
    8% 0,
    100% 0,
    92% 100%,
    0 100%
  );

  background:var(--calcio-pink);

  color:#151217;

  font-size:11px;

  font-weight:1000;

  letter-spacing:.02em;
}

.fixture{
  display:flex;

  align-items:center;

  justify-content:center;

  min-width:0;

  min-height:24px;

  color:#fff;

  white-space:nowrap;
}

.fixtureTeam{
  display:flex;

  align-items:center;

  gap:4px;

  min-width:0;

  color:#fff;

  font-size:12px;

  font-weight:1000;
}

.fixtureTeam.away{
  flex-direction:row-reverse;
}

.fixtureLogo{
  width:18px;

  height:18px;

  flex:0 0 18px;

  object-fit:contain;

  background:transparent;
}

.fixtureVs{
  margin:0 3px;

  color:var(--calcio-pink);

  font-size:9px;

  font-weight:1000;
}

@media(max-width:900px){

  .grid3{
    grid-template-columns:
      1fr 1fr;
  }

  .matchdayGrid{
    grid-template-columns:
      repeat(3,1fr);
  }

}

@media(max-width:700px){

  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  .figurePlayerGrid{
    grid-template-columns:1fr;
  }

  .matchdayGrid{
    grid-template-columns:
      repeat(2,1fr);
  }

  header{
    align-items:flex-start;
  }

}

@media(max-width:430px){

  .matchdayGrid{
    grid-template-columns:1fr;
  }

  .fixtureBoard{
    padding:20px 10px 18px;
  }

  .fixtureSchedule{
    gap:9px 6px;
  }

  .fixtureTeam{
    gap:3px;

    font-size:11px;
  }

  .fixtureLogo{
    width:16px;

    height:16px;

    flex-basis:16px;
  }

  .fixtureVs{
    margin:0 2px;

    font-size:8px;
  }

}

h1,
h2,
h3,
p{
  margin-top:0;
}

h1{
  letter-spacing:-.03em;
}

h2{
  font-size:20px;
}

.muted{
  color:var(--muted);
}

.success{
  color:var(--accent);
}

.error{
  color:var(--danger);
}

input,
select,
textarea{
  width:100%;

  background:var(--dark);

  color:var(--cream);

  border:
    1px solid
    var(--line);

  border-radius:12px;

  padding:12px;

  outline:none;
}

textarea{
  resize:vertical;

  min-height:76px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--accent);
}

button{
  border:0;

  border-radius:12px;

  padding:11px 14px;

  background:var(--accent);

  color:#17181a;

  font-weight:800;
}

button.primary{
  background:var(--accent);
}

button.ghost{
  background:transparent;

  color:var(--cream);

  border:1px solid var(--line);
}

button.danger{
  background:transparent;

  color:var(--danger);

  border:
    1px solid
    rgba(
      255,
      129,
      111,
      .4
    );
}

button:disabled{
  opacity:.4;

  cursor:not-allowed;
}

.row{
  display:flex;

  gap:8px;

  align-items:center;

  flex-wrap:wrap;
}

.stack{
  display:grid;

  gap:10px;
}

.thesis{
  background:#1c1e21;

  border:
    1px solid
    var(--line);

  border-radius:14px;

  padding:13px;
}

.badge{
  display:inline-flex;

  align-items:center;

  gap:5px;

  padding:5px 9px;

  border-radius:100px;

  background:#181a1d;

  border:1px solid var(--line);

  color:var(--muted);

  font-size:12px;

  margin:2px;
}

.actions{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:14px;
}

.lobbyCard{
  display:flex;

  flex-direction:column;

  min-height:235px;
}

.lobbyCard .actions{
  margin-top:auto;
}

.lobbyName{
  font-size:22px;

  font-weight:900;

  margin-top:12px;
}

.lobbyCode{
  color:var(--muted);

  font-size:13px;

  margin-top:4px;
}

.matchdayCard{
  background:#1c1e21;

  border:1px solid var(--line);

  border-radius:15px;

  padding:13px;

  min-height:180px;

  display:flex;

  flex-direction:column;
}

.matchdayNumber{
  font-size:20px;

  font-weight:900;
}

.matchdayDate{
  margin-top:6px;

  font-size:13px;

  font-weight:800;

  color:var(--cream);
}

.matchdayStatus{
  margin-top:7px;

  color:var(--muted);

  font-size:12px;
}

.matchdayCard .actions{
  margin-top:auto;
}

.templateDay{
  background:#1c1e21;

  border:1px solid var(--line);

  border-radius:13px;

  padding:11px;

  cursor:pointer;
}

.templateDay:hover{
  border-color:var(--accent);
}

.templateDay.active{
  border-color:var(--accent);

  background:#35383d;
}

.templateDay.complete .templateCount{
  color:var(--accent);
}

.templateNumber{
  font-weight:900;

  font-size:17px;
}

.templateDate{
  margin-top:5px;

  font-size:12px;

  font-weight:700;

  color:var(--cream);
}

.templateCount{
  color:var(--muted);

  font-size:12px;

  margin-top:4px;
}

.editorRow{
  display:grid;

  grid-template-columns:
    42px 1fr;

  gap:9px;

  align-items:start;
}

.editorNumber{
  width:42px;
  height:42px;

  border-radius:12px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#181a1d;

  border:1px solid var(--line);

  font-weight:900;
}

.turn{
  background:var(--accent);

  color:#17181a;

  border-radius:14px;

  padding:13px;

  font-weight:900;

  text-align:center;

  margin-bottom:12px;
}

.phasebar{
  display:flex;

  gap:6px;

  overflow-x:auto;

  margin-bottom:14px;

  scrollbar-width:none;
}

.phasebar::-webkit-scrollbar{
  display:none;
}

.phasebar span{
  white-space:nowrap;

  padding:7px 10px;

  border-radius:99px;

  background:#17191c;

  color:#92979e;

  font-size:12px;

  cursor:pointer;

  user-select:none;
}

.phasebar span.active{
  background:var(--accent);

  color:#17181a;

  font-weight:800;
}

.ruleList{
  display:grid;

  gap:10px;
}

.ruleList > div{
  padding:12px;

  border-radius:12px;

  background:#17191c;

  line-height:1.55;
}

.fields{
  display:grid;

  gap:8px;
}

.field{
  display:grid;

  grid-template-columns:
    70px 1fr;

  gap:10px;

  align-items:center;

  background:#181a1d;

  border:1px solid var(--line);

  border-radius:14px;

  padding:10px;
}

.fieldLabel{
  font-size:22px;

  font-weight:900;

  text-align:center;
}

.fieldButtons{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:10px;
}

.fieldButton{
  background:transparent;

  color:var(--cream);

  border:1px solid var(--line);
}

.fieldButton:hover{
  border-color:var(--accent);

  color:var(--accent);
}

.score{
  display:grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items:center;

  gap:14px;

  text-align:center;
}

.points{
  font-size:
    clamp(
      34px,
      8vw,
      64px
    );

  font-weight:900;
}

.vs{
  color:var(--muted);

  font-size:24px;

  font-weight:900;
}

.bigResult{
  text-align:center;

  font-size:
    clamp(
      32px,
      8vw,
      70px
    );

  font-weight:900;
}

hr{
  border:0;

  border-top:
    1px solid
    var(--line);

  margin:18px 0;
}

.footer{
  margin-top:40px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

.loading{
  padding:60px 20px;

  text-align:center;

  color:var(--muted);
}

#toast{
  position:fixed;

  left:50%;
  bottom:20px;

  transform:
    translateX(-50%);

  max-width:
    calc(100% - 30px);

  padding:10px 16px;

  background:var(--cream);

  color:#17181a;

  border-radius:100px;

  font-weight:800;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:1000;
}

#toast.show{
  opacity:1;
}

</style>

function appFingerprint(
  value
){

  let hash =
    2166136261;


  for(
    let index = 0;
    index < value.length;
    index += 1
  ){

    hash ^= value.charCodeAt(
      index
    );


    hash = Math.imul(
      hash,
      16777619
    );

  }


  return (
    hash >>> 0
  ).toString(
    36
  );

}



function fingerprintFromHtml(
  html
){

  const parsed =
    new DOMParser()
      .parseFromString(
        html,
        "text/html"
      );


  const inlineScripts =
    Array.from(
      parsed.scripts
    )
      .filter(
        script =>
          !script.src
      );


  const appScript =
    inlineScripts.at(-1);


  const style =
    parsed.querySelector(
      "style"
    );


  if(
    !appScript
    ||
    !style
  ){

    return "";

  }


  return appFingerprint(
    style.textContent +
    "\n" +
    appScript.textContent +
    "\n" +
    parsed.title
  );

}

        url.searchParams.set(

}

function berlinNowKey(){

    timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hourCycle:"h23"
  }).formatToParts(new Date());
  const get = type => parts.find(part => part.type === type)?.value || "";
  return `${get("year")}-${get("month")}-${get("day")}T${get("hour")}:${get("minute")}`;
}

){

  if(
    session

    !(
      forceAnonymous
      &&
      session.user.email
    )
  ){

    state.user =
      session.user;

    return;

  }


  if(
    session?.user?.email
  ){

    const {
      error:signOutError

      await db.auth.signOut({

    if(signOutError){

  } =
    await db.auth
      .signInAnonymously();


  if(error){
    throw error;
  }


  state.user =
    data.session.user;

let appUpdatePendingFingerprint =

let appUpdateMonitorStarted =

function reloadForAppUpdate(
  fingerprint
){

  const url =
    new URL(
      location.href
    );


  url.searchParams.set(
    "v",
    fingerprint
  );


  url.searchParams.set(
    "app_refresh",
    Date.now()
  );


  location.replace(
    url.toString()
  );

}



async function checkForAppUpdate(
  initialCheck=false
){

  if(appUpdateCheckActive){
    return false;
  }


  appUpdateCheckActive =
    true;


  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      () =>
        controller.abort(),
      5000
    );


  try{

    const checkUrl =
      new URL(
        appBase()
      );


    checkUrl.searchParams.set(
      "app_update_check",
      Date.now()
    );


    const response =
      await fetch(
        checkUrl.toString(),
        {
          cache:"no-store",
          signal:controller.signal
        }
      );


    if(!response.ok){
      return false;
    }


    const remoteFingerprint =
      fingerprintFromHtml(
        await response.text()
      );


    if(
      !remoteFingerprint
      ||
      remoteFingerprint ===
        APP_SOURCE_FINGERPRINT
    ){

      appUpdatePendingFingerprint =
        "";


      return false;

    }


    if(
      !initialCheck
      &&
      userIsEditingApp()
    ){

      if(
        appUpdatePendingFingerprint !==
        remoteFingerprint
      ){

        toast(
          "Neue App-Version erkannt – Aktualisierung nach deiner Eingabe"
        );

      }


      appUpdatePendingFingerprint =
        remoteFingerprint;


      return false;

    }


    reloadForAppUpdate(
      remoteFingerprint
    );


    return true;

  }

  catch(error){

    if(
      error?.name !==
      "AbortError"
    ){

      console.debug(
        "Versionsprüfung vorübergehend nicht verfügbar"
      );

    }


    return false;

  }

  finally{

    clearTimeout(
      timeout
    );


    appUpdateCheckActive =
      false;

  }

}



function startAppUpdateMonitor(){

  if(appUpdateMonitorStarted){
    return;
  }


  appUpdateMonitorStarted =
    true;


  setInterval(
    () => {

      if(
        document.visibilityState ===
        "visible"
      ){

        checkForAppUpdate();

      }

    },
    60000
  );


  window.addEventListener(
    "focus",
    () =>
      checkForAppUpdate()
  );


  document.addEventListener(
    "visibilitychange",
    () => {

      if(
        document.visibilityState ===
        "visible"
      ){

        checkForAppUpdate();

      }

    }
  );

}

      "";



    if(
      thesisOverview
    ){

      if(
        !isMainAccount()
      ){

        renderStartPage(
          ""
        );

        return;

      }


      const requestedMatchday=Number(thesisOverview);
      if(requestedMatchday >= 1 && requestedMatchday <= 34){
        state.selectedTemplateMatchday=requestedMatchday;
      }
      state.thesisInputMode=params.get("edit") === "1";
      await loadThesisOverview();

      return;

    }



    if(
      gameId
    ){

      if(
        !state.user
      ){

        renderStartPage(
          ""
        );

        return;

      }


      state.gameId =
        gameId;


      await refreshGame();


      subscribeGame();


      return;

    }



    if(
      lobbyId
    ){

      if(
        !state.user
      ){

        renderStartPage(
          ""
        );

        return;

      }


      state.lobbyId =
        lobbyId;


      await refreshLobby();


      subscribeLobby();


      return;

    }



    if(
      roomCode
    ){

      if(accessToken){

        await openGuestInvite(
          roomCode,
          accessToken
        );

      }

      else{

        renderGuestJoinPage(
          roomCode,
          ""
        );

      }

      return;

    }



    if(
      isMainAccount()
    ){

      await loadDashboard();

      return;

    }



    renderStartPage(
      ""
    );

  }

  catch(error){

    console.error(
      error
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="card">

        <h2>
          Fehler beim Laden
        </h2>

        <p class="error">
          ${esc(
            error.message
          )}
        </p>

        <button
          onclick="goHome()"
        >
          Zur Startseite
        </button>

      </div>

    `;

  }

}

async function loadThesisOverview(){

    data,

    await db

      .from(
        "global_theses"
      )

      .select(
        "*"
      )

      .eq(
        "owner_id",
        state.user.id
      )

      .order(
        "matchday"
      )

      .order(
        "slot"
      );


  if(error){
    throw error;
  }


  state.globalTheses =
    data
    ||
    [];


  renderThesisOverview();

}



function templateCount(
  matchday
){

  return state.globalTheses.filter(
    thesis =>

      thesis.matchday ===
      matchday

      &&

      thesis.text
        ?.trim()

  ).length;

}



function templateText(
  matchday,
  slot
){

  return (

    state.globalTheses.find(
      thesis =>

        thesis.matchday ===
        matchday

        &&

        thesis.slot ===
        slot
    )

    ?.text

    ||

    ""

  );

}



function selectTemplateMatchday(

){

  state.selectedTemplateMatchday =
    matchday;


  renderThesisOverview();

async function loadDashboard(){

  const membershipResult =
    await db

      .from(
        "lobby_players"
      )

      .select(
        "*"
      )

      .eq(
        "user_id",
        state.user.id
      );


  if(
    membershipResult.error
  ){

    throw membershipResult.error;

  }


  const memberships =
    membershipResult.data
    ||
    [];


  if(
    !memberships.length
  ){

    state.myLobbies =
      [];


    state.myLobbyPlayers =
      [];


    renderDashboard();


    return;

  }


  const lobbyIds =
    [
      ...new Set(
        memberships.map(
          item =>
            item.lobby_id
        )
      )
    ];


  const [
    lobbyResult,
    playerResult
  ] =
    await Promise.all([


      db
        .from(
          "lobbies"
        )

        .select(
          "*"
        )

        .in(
          "id",
          lobbyIds
        )

        .order(
          "created_at",
          {
            ascending:false
          }
        ),


      db
        .from(
          "lobby_players"
        )

        .select(
          "*"
        )

        .in(
          "lobby_id",
          lobbyIds
        )

        .order(
          "seat"
        )


    ]);


  if(
    lobbyResult.error
  ){

    throw lobbyResult.error;

  }


  if(
    playerResult.error
  ){

    throw playerResult.error;

  }


  state.myLobbies =
    lobbyResult.data
    ||
    [];


  state.myLobbyPlayers =
    playerResult.data
    ||
    [];


  renderDashboard();

}

async function renameLobby(
  id,
  currentName
){

  const newName =
    prompt(
      "Neuer Lobbyname:",

    newName === null
  ){

    return;

  }


  if(
    !newName.trim()
  ){

    toast(
      "Lobbyname darf nicht leer sein"
    );

    return;

  }


  try{

    const {
      error
    } =
      await db.rpc(
        "rename_lobby",
        {

          p_lobby_id:
            id,

          p_name:
            newName.trim()

        }
      );


    if(error){
      throw error;

      "Lobby umbenannt"

    if(
      state.lobbyId ===

    );

}

  try{

    const {
      error
    } =

    );

========================================================= */


async function refreshLobby(){

  const [
    lobbyResult,
    playersResult,
    gamesResult
  ] =
    await Promise.all([


      db
        .from(
          "lobbies"
        )

        .select(
          "*"
        )

        .eq(
          "id",
          state.lobbyId
        )

        .single(),


      db
        .from(
          "lobby_players"
        )

        .select(
          "*"
        )

        .eq(
          "lobby_id",
          state.lobbyId
        )

        .order(
          "seat"
        ),


      db
        .from(
          "games"
        )

        .select(
          "*"
        )

        .eq(
          "lobby_id",
          state.lobbyId
        )

        .order(
          "matchday"
        )


    ]);


  if(
    lobbyResult.error
  ){

    throw lobbyResult.error;

  }


  if(
    playersResult.error
  ){

    throw playersResult.error;

  }


  if(
    gamesResult.error
  ){

    throw gamesResult.error;

  }


  state.lobby =
    lobbyResult.data;


  state.lobbyPlayers =
    playersResult.data
    ||
    [];


  state.matchdayGames =
    gamesResult.data
    ||
    [];

  if(state.lobby.created_by === state.user.id){
    const {data,error} = await db
      .from("global_theses")
      .select("matchday,slot,text")
      .eq("owner_id",state.user.id);

    if(error){
      throw error;
    }

    state.globalTheses = data || [];
  }
  else{
    state.globalTheses = [];
  }


  renderLobbySeason();

}



function renderLobbySeason(){

  const owner =
    state.lobby.created_by ===
    state.user.id;


  const opponent =
    state.lobbyPlayers.find(
      player =>
        player.user_id !==
        state.user.id
    );


  const finishedCount =
    state.matchdayGames.filter(
      game =>
        game.status ===
        "finished"
    ).length;


  document.getElementById(
    "headerActions"
  ).innerHTML = `

    ${playerNameBadge(currentLobbyPlayerName())}

    ${
      isMainAccount()

        ? `

          <button
            class="ghost"
            onclick="goHome()"

function renderMatchday(
  matchday,
  owner,
  hasOpponent
){

  const game =
    state.matchdayGames.find(
      item =>
        item.matchday ===
        matchday
    );


  const date =
    matchdayDates[
      matchday
    ]
    ||
    "";

  const thesisCount = owner
    ? matchdayThesisCount(matchday)
    : 0;
  const thesesReady = thesisCount === 12;
  const locked = matchdayIsLocked(matchday);


  if(
    game
  ){

    return `

      <div class="matchdayCard">

        <div class="matchdayNumber">
          Spieltag ${matchday}
        </div>


        <div class="matchdayDate">
          📅 ${date}
        </div>


        <div class="matchdayStatus">

          ${game.status === "lobby" && locked
            ? "🔒 Draftstart geschlossen"
            : (statusNames[game.status] || game.status)}

        </div>


        <div class="actions">

          <button
            class="primary"
            onclick='openGame(${jsArg(
              game.id
            )})'
          >
            Öffnen
          </button>

        </div>

      </div>

    `;

  }


  return `

    <div class="matchdayCard">

      <div class="matchdayNumber">
        Spieltag ${matchday}
      </div>


      <div class="matchdayDate">
        📅 ${date}
      </div>


      <div class="matchdayStatus">
        ${locked
          ? "🔒 Erstellung geschlossen"
          : (!hasOpponent
              ? "Spieler 2 fehlt"
              : (!thesesReady
                  ? `${thesisCount}/12 Thesen hinterlegt`
                  : "Bereit zur Erstellung"))}
      </div>


      <div class="actions">

        ${
          owner

            ? `

              <button
                class="primary"

                ${
                  !hasOpponent || !thesesReady || locked
                    ? "disabled"
                    : ""
                }

                onclick="
                  createMatchdayGame(
                    ${matchday}
                  )
                "
              >
                Spiel erstellen
              </button>

            `

            : `

              <span class="muted">
                Wartet auf Spieler 1
              </span>

            `
        }

      </div>

    </div>

  `;

}



async function createMatchdayGame(
  matchday
){

  try{

    if(matchdayIsLocked(matchday)){
      throw new Error("Dieser Spieltag ist bereits gesperrt.");
    }

    if(matchdayThesisCount(matchday) !== 12){
      throw new Error("Für diesen Spieltag müssen exakt 12 globale Thesen hinterlegt sein.");
    }

    const {
      data,
      error
    } =
      await db.rpc(
        "create_matchday_game",
        {

          p_lobby_id:
            state.lobbyId,

          p_matchday:
            matchday

        }
      );


    if(error){
      throw error;
    }


    openGame(
      data[0].game_id
    );

  }

  catch(error){

    errorMessage(
      error
    );

  }

}

async function refreshGame(){

  const [
    gameResult,
    playerResult,
    thesisResult,
    placementResult,
    figureResult
  ] =
    await Promise.all([


      db
        .from(
          "games"
        )

        .select(
          "*"
        )

        .eq(
          "id",
          state.gameId
        )

        .single(),


      db
        .from(
          "players"
        )

        .select(
          "*"
        )

        .eq(
          "game_id",
          state.gameId
        )

        .order(
          "seat"
        ),


      db
        .from(
          "theses"
        )

        .select(
          "*"
        )

        .eq(
          "game_id",
          state.gameId
        )

        .order(
          "template_slot",
          {
            nullsFirst:false
          }
        )

        .order(
          "created_at"
        ),


      db
        .from(
          "placements"
        )

        .select(
          "*"
        )

        .eq(
          "game_id",
          state.gameId
        ),


      db
        .from(
          "figure_picks"
        )

        .select(
          "*"
        )

        .eq(
          "game_id",
          state.gameId
        )

        .order(
          "draft_order"
        )


    ]);


  if(
    gameResult.error
  ){

    throw gameResult.error;

  }


  if(
    playerResult.error
  ){

    throw playerResult.error;

  }


  if(
    thesisResult.error
  ){

    throw thesisResult.error;

  }


  if(
    placementResult.error
  ){

    throw placementResult.error;

  }


  if(
    figureResult.error
  ){

    throw figureResult.error;

  }


  state.game =
    gameResult.data;


  state.players =
    playerResult.data
    ||
    [];


  state.theses =
    thesisResult.data
    ||
    [];


  state.placements =
    placementResult.data
    ||
    [];


  state.figures =
    figureResult.data
    ||
    [];

  await Promise.all([loadBundesligaPlayers(),loadFigureUsage()]);


  state.me =
    state.players.find(
      player =>
        player.user_id ===
        state.user.id
    );


  if(
    !state.me
  ){

    throw new Error(
      "Du bist kein Spieler dieses Spieltags."
    );

  }


  renderGame();

}

let refreshTimer;



function scheduleGameRefresh(){

  clearTimeout(
    refreshTimer
  );


  refreshTimer =
    setTimeout(
      () => {

        refreshGame()
          .catch(
            errorMessage
          );

      },
      130
    );

}



function subscribeGame(){

  if(
    state.channel
  ){

    db.removeChannel(
      state.channel
    );

  }


  const channel =
    db.channel(
      `game-${state.gameId}`
    );


  [
    "games",
    "players",
    "theses",
    "placements",
    "figure_picks"
  ]

  .forEach(
    table => {

      channel.on(

        "postgres_changes",

        {

          event:"*",

          schema:"public",

          table,

          filter:

            table ===
            "games"

              ? `id=eq.${state.gameId}`

              : `game_id=eq.${state.gameId}`

        },

        scheduleGameRefresh

      );

    }
  );


  channel.subscribe();


  state.channel =
    channel;

}



function scheduleLobbyRefresh(){

  clearTimeout(
    refreshTimer
  );


  refreshTimer =
    setTimeout(
      () => {

        refreshLobby()
          .catch(
            errorMessage
          );

      },
      130
    );

}



function subscribeLobby(){

  if(
    state.channel
  ){

    db.removeChannel(
      state.channel
    );

  }


  const channel =
    db.channel(
      `lobby-${state.lobbyId}`
    );


  channel.on(

    "postgres_changes",

    {

      event:"*",

      schema:"public",

      table:"lobbies",

      filter:
        `id=eq.${state.lobbyId}`

    },

    scheduleLobbyRefresh

  );


  channel.on(

    "postgres_changes",

    {

      event:"*",

      schema:"public",

      table:"lobby_players",

      filter:
        `lobby_id=eq.${state.lobbyId}`

    },

    scheduleLobbyRefresh

  );


  channel.on(

    "postgres_changes",

    {

      event:"*",

      schema:"public",

      table:"games",

      filter:
        `lobby_id=eq.${state.lobbyId}`

    },

    scheduleLobbyRefresh

  );


  channel.subscribe();


  state.channel =
    channel;

}

========================================================= */


function thesisPoints(
  placement,
  thesis
){

  if(
    thesis?.resolved === null

    ||

    thesis?.resolved === undefined
  ){

    return 0;

  }


  switch(
    placement.field
  ){

    case "P1":

      return thesis.resolved
        ? 1
        : 0;


    case "N1":

      return thesis.resolved
        ? -1
        : 0;


    case "P3":

      return thesis.resolved
        ? 3
        : -3;


    case "N3":

      return thesis.resolved
        ? -3
        : 3;


    case "Q":

      switch(
        state.game.question_value
      ){

        case "+2":
          return thesis.resolved ? 2 : 0;

        case "+/-3":
          return thesis.resolved ? 3 : -3;

        case "+1":
          return thesis.resolved ? 1 : 0;

        case "+3":
          return thesis.resolved ? 3 : 0;

        case "-3":
          return thesis.resolved ? -3 : 0;

        default:
          return thesis.resolved
            ? Number(state.game.random_value || 0)
            : -Number(state.game.random_value || 0);

      }

  }


  return 0;

}



function playerScore(
  userId
){

  let thesisTotal =
    0;


  let figureTotal =
    0;


  state.placements

    .filter(
      placement =>
        placement.user_id ===
        userId
    )

    .forEach(
      placement => {

        const thesis =
          state.theses.find(
            item =>
              item.id ===
              placement.thesis_id
          );


        thesisTotal +=
          thesisPoints(
            placement,
            thesis
          );

      }
    );


  state.figures

    .filter(
      figure =>
        figure.user_id ===
        userId
    )

    .forEach(
      figure => {

        figureTotal +=
          Number(
            figure.points ||
            0
          );

      }
    );


  return {

    thesis:
      thesisTotal,

    figures:
      figureTotal,

    total:
      thesisTotal +
      figureTotal

  };

}

========================================================= */
function pairingOptions(matchday, selected){
  const general = `<option value="Spieltag" ${selected==="Spieltag"?"selected":""}>Spieltag · allgemeine These</option>`;
  return general + (matchdayFixtures[matchday] || []).map(([home,away]) => {
    const value = `${clubData[home].abbr} – ${clubData[away].abbr}`;
    return `<option value="${esc(value)}" ${value===selected?"selected":""}>${esc(value)}</option>`;
  }).join("");
}

function pairingPreview(value){
  if(!value || value === "Spieltag") return `<span class="badge">⚽ Spieltag · allgemeine These</span>`;
  const fixture=(Object.values(matchdayFixtures).flat()).find(([home,away]) => `${clubData[home].abbr} – ${clubData[away].abbr}`===value);
  if(!fixture) return "";
  return `<span class="fixtureTeam"><img class="fixtureLogo" src="${clubLogoUrl(clubData[fixture[0]])}" alt="" onerror="this.remove()"><span>${esc(clubData[fixture[0]].abbr)}</span></span><span class="muted"> – </span><span class="fixtureTeam"><img class="fixtureLogo" src="${clubLogoUrl(clubData[fixture[1]])}" alt="" onerror="this.remove()"><span>${esc(clubData[fixture[1]].abbr)}</span></span>`;
}

function drawResult(label,value){
  return `<div class="card" style="margin:0;text-align:center"><div class="muted" style="font-size:12px;font-weight:800">🎲 ${esc(label)}</div><div style="font-weight:900;margin-top:8px">${value}</div></div>`;
}

function draftThesisPairing(thesis){
  const value=thesis.pairing || "Spieltag";
  if(value === "Spieltag") return `<div style="text-align:center;color:var(--cream);font-weight:900">Spieltag</div>`;
  const fixture=(Object.values(matchdayFixtures).flat()).find(([home,away])=>`${clubData[home].abbr} – ${clubData[away].abbr}`===value);
  if(!fixture) return `<div class="muted" style="font-weight:800">${esc(value)}</div>`;
  const [home,away]=fixture;
  return `<div class="fixture" style="padding:0;background:transparent;border:0;justify-content:center"><div class="fixtureTeam">${renderFixtureTeam(home)}</div><span class="fixtureVs">VS</span><div class="fixtureTeam">${renderFixtureTeam(away,true)}</div></div>`;
}

function refreshPairingPreview(slot){
  const select=document.getElementById(`globalPairing${slot}`);
  const preview=document.getElementById(`pairingPreview${slot}`);
  if(select && preview) preview.innerHTML=pairingPreview(select.value);
}

function pairingControl(matchday, slot, selected){
  const fixtures=matchdayFixtures[matchday] || [];
  const choices=fixtures.map(([home,away])=>{
    const value=`${clubData[home].abbr} – ${clubData[away].abbr}`;
    return `<button type="button" class="ghost" onclick='choosePairing(${slot},${jsArg(value)})'>${renderFixtureTeam(home)}${renderFixtureTeam(away,true)}</button>`;
  }).join("");
  return `<input type="hidden" id="globalPairing${slot}" value="${esc(selected)}"><details class="pairingChooser"><summary id="pairingPreview${slot}">${pairingPreview(selected)}</summary><div class="stack" style="margin-top:8px"><button type="button" class="ghost" onclick='choosePairing(${slot},"Spieltag")'>⚽ Spieltag · allgemeine These</button>${choices}</div></details>`;
}

function choosePairing(slot,value){
  const input=document.getElementById(`globalPairing${slot}`);
  if(input) input.value=value;
  const preview=document.getElementById(`pairingPreview${slot}`);
  if(preview) preview.innerHTML=pairingPreview(value);
  preview?.closest("details")?.removeAttribute("open");
}

function templatePairing(matchday, slot){
  return state.globalTheses.find(t => t.matchday===matchday && t.slot===slot)?.pairing || "";
}

function thesisWithPairing(thesis){
  return `${thesis.pairing ? `<span class="badge">⚽ ${esc(thesis.pairing)}</span> ` : ""}${esc(thesis.text)}`;
}

function openThesisInput(matchday){
  state.selectedTemplateMatchday = matchday;
  state.thesisInputMode = true;
  const url=new URL(location.href);
  url.searchParams.set("theses", String(matchday));
  url.searchParams.set("edit", "1");
  history.pushState({}, "", url);
  renderThesisOverview();
}

function closeThesisInput(){
  state.thesisInputMode = false;
  const url=new URL(location.href);
  url.searchParams.delete("edit");
  history.pushState({}, "", url);
  renderThesisOverview();
}

renderThesisOverview = function(){
  const selected = state.selectedTemplateMatchday;
  document.getElementById("headerActions").innerHTML = `${playerNameBadge(accountName())}<button class="ghost" onclick="goHome()">← Lobby-Übersicht</button>`;
  if(state.thesisInputMode){
    document.getElementById("app").innerHTML = `<div class="card"><span class="badge">Eingabeansicht</span><h1>Thesen · Spieltag ${selected}</h1><p class="muted">Wähle für jede These eine Paarung mit Wappen und Kürzeln – oder „Spieltag“ für eine allgemeine These.</p><div class="stack">${Array.from({length:12},(_,i)=>{const slot=i+1; const selectedPairing=templatePairing(selected,slot)||"Spieltag"; return `<div class="editorRow"><div class="editorNumber">${slot}</div><div style="flex:1">${pairingControl(selected,slot,selectedPairing)}<textarea id="globalThesis${slot}" maxlength="180" placeholder="These ${slot}">${esc(templateText(selected,slot))}</textarea></div></div>`}).join("")}</div><div class="actions"><button class="primary" onclick="saveGlobalTheses()">Speichern & synchronisieren</button><button class="ghost" onclick="closeThesisInput()">Abbrechen</button></div></div>`;
    return;
  }
  document.getElementById("app").innerHTML = `<div class="card"><span class="badge">Zentrale Verwaltung</span><h1>Thesen Übersicht</h1><p class="muted">Übersicht ohne Eingabefelder. Ein Spieltag öffnet die eigene Bearbeitungsansicht.</p></div><div class="card"><h2>Spieltage</h2><div class="matchdayGrid">${Array.from({length:34},(_,i)=>{const md=i+1,count=templateCount(md);return `<div class="templateDay ${md===selected?"active":""} ${count===12?"complete":""}" onclick="openThesisInput(${md})"><div class="templateNumber">Spieltag ${md}</div><div class="templateDate">📅 ${matchdayDates[md]}</div><div class="templateCount">${count}/12 Thesen</div></div>`}).join("")}</div></div><div class="card"><h2>Spieltag ${selected}</h2><div class="stack">${Array.from({length:12},(_,i)=>{const s=i+1,t=templateText(selected,s),p=templatePairing(selected,s);return `<div class="thesis"><strong>${s}.</strong> ${p?`<span class="badge">⚽ ${esc(p)}</span>`:'Spieltag'}<div style="margin-top:7px">${t?esc(t):'Noch keine These'}</div></div>`}).join("")}</div><div class="actions"><button class="primary" onclick="openThesisInput(${selected})">Thesen bearbeiten</button></div></div>`;
};

saveGlobalTheses = async function(){
  try{
    const theses=Array.from({length:12},(_,i)=>document.getElementById(`globalThesis${i+1}`).value.trim());
    const pairings=Array.from({length:12},(_,i)=>document.getElementById(`globalPairing${i+1}`).value);
    if(theses.some(t=>!t) || pairings.some(p=>!p)) throw new Error("Bitte alle zwölf Thesen und Paarungen ausfüllen.");
    const {error}=await db.rpc("save_global_theses",{p_matchday:state.selectedTemplateMatchday,p_theses:theses,p_pairings:pairings});
    if(error) throw error;
    toast("Thesen und Paarungen gespeichert und synchronisiert");
    state.thesisInputMode=false; await loadThesisOverview();
  }catch(error){errorMessage(error)}
};

// In der Übersicht bleiben nur die Spieltag-Kacheln; die Detail-Liste ist redundant.
const renderThesisOverviewWithDetails = renderThesisOverview;
renderThesisOverview = function(){
  renderThesisOverviewWithDetails();
  if(!state.thesisInputMode){
    document.querySelector("#app .card:last-child")?.remove();
  }
};

async function loadBundesligaPlayers(){
  const {data,error}=await db.from("bundesliga_players").select("name,club,position").eq("active",true).order("club").order("name");
  state.bundesligaPlayers=error?[]:(data||[]);
}
async function loadFigureUsage(){
  const [usage,drafted]=await Promise.all([db.rpc("get_figure_usage",{p_game_id:state.gameId}),db.rpc("get_matchday_figure_availability",{p_game_id:state.gameId})]);
  state.figureUsage=Object.fromEntries((usage.data||[]).map(x=>[x.footballer.toLocaleLowerCase("de"),Number(x.uses)]));
  state.matchdayDrafted=Object.fromEntries((drafted.data||[]).map(x=>[x.footballer.toLocaleLowerCase("de"),true]));
}
function displayFigureName(figure){
  return figureNames[figure] || figure;
}
function filterBundesligaPlayers(){
  const club=document.getElementById("clubInput")?.value||"", figure=document.getElementById("figureSelect")?.value||"", query=(document.getElementById("footballerInput")?.value||"").toLocaleLowerCase("de"), list=document.getElementById("bundesligaPlayerList");
  if(!list)return;
  list.innerHTML=state.bundesligaPlayers.filter(p=>(!club||p.club===club)&&(figure!=="ROOK"||p.position==="Torhüter")&&(!query||p.name.toLocaleLowerCase("de").includes(query))).slice(0,100).map(p=>{const key=p.name.toLocaleLowerCase("de"), used=state.figureUsage[key]||0, blocked=state.matchdayDrafted[key], remaining=Math.max(0,3-used);return `<option value="${esc(p.name)}" label="${esc(p.club)} · ${blocked?"bereits gedraftet":`${remaining}/3`}"></option>`}).join("");
}
pickFigure=async function(){
  try{const figure=document.getElementById("figureSelect").value, footballer=document.getElementById("footballerInput").value.trim(), club=document.getElementById("clubInput").value;const player=state.bundesligaPlayers.find(p=>p.name.toLocaleLowerCase("de")===footballer.toLocaleLowerCase("de")&&(!club||p.club===club));
    if(!player)throw new Error("Bitte einen aktuellen Bundesliga-Spieler aus der Auswahl wählen.");
    const key=player.name.toLocaleLowerCase("de"); if(state.matchdayDrafted[key])throw new Error("Dieser Spieler wurde an diesem Spieltag bereits gedraftet."); if((state.figureUsage[key]||0)>=3)throw new Error("Dieser Spieler wurde in dieser Saison bereits dreimal gewählt."); if(figure==="ROOK"&&player.position!=="Torhüter")throw new Error("Für den Turm sind nur Torhüter auswählbar.");
    const {error}=await db.rpc("pick_figure",{p_game_id:state.gameId,p_figure:figure,p_footballer:player.name,p_club:player.club});if(error)throw error;
  }catch(error){errorMessage(error)}
};

startApp();


</script>
